const FQEN={npc:"fred",title:"🐾 Personal side quest: Frederick's Files",start:"a",nodes:{
 a:{say:"Frederick drops a chewed folder at your feet. Inside: vet reminders on napkins, a feeding schedule that lives in three people's heads, and 40 unposted photos of him being majestic. This dog needs an ops system.",
    codex:"Personal ops is PM discipline with smaller stakes: one source of truth, recurring reminders for anything on a cycle (food, vet, grooming), and one list everyone shares. If it repeats, it gets a reminder — memory is not a system.",
    q:"How do you organize Frederick's life?",
    ch:[{t:"One giant sticky note on the fridge",out:{r:"mid",concept:"Single source of truth",why:"It IS one source of truth — but nothing reminds anyone of anything, and the vet appointment dies the day someone needs the fridge. Half credit.",beat:"Frederick sniffs the sticky note. Unimpressed."}},
        {t:"A shared calendar with recurring reminders + one shared checklist",next:"b"},
        {t:"Hire a dog assistant",out:{r:"bad",concept:"Single source of truth",why:"An assistant for a dog's calendar is a payroll line for a problem two recurring reminders solve.",beat:"Marcus appears from nowhere. “A WHAT for the dog?”"}}]},
 b:{say:"His public awaits. Forty majestic photos, zero posts. Frederick's content pipeline?",
    codex:"Creative work batches: one session producing a month of content beats posting when you remember. AI drafts the captions; a human approves before anything goes out — Frederick cannot approve, he is a dog.",
    q:"The content plan is…",
    ch:[{t:"Post whenever you remember",out:{r:"mid",concept:"Batching & scheduling",why:"That's how it's going now — 40 photos, zero posts. Sporadic effort loses to a boring schedule every time. Half credit for honesty.",beat:"Frederick's fans refresh in vain."}},
        {t:"Monthly batch day: AI drafts captions, you approve, a scheduler posts",out:{r:"ok",concept:"Batching & scheduling",why:"One hour a month, AI does the writing, human keeps the judgment, the scheduler does the remembering. Frederick's brand: consistent.",beat:"First scheduled post hits 200 likes. Frederick remains humble."}},
        {t:"Let AI auto-post as Frederick, unsupervised",out:{r:"bad",concept:"Batching & scheduling",why:"Unsupervised auto-posting is how brands die. No review, no floor.",beat:"Within the hour, Frederick's account endorses a crypto scheme."}}]}}};
const FQES={npc:"fred",title:"🐾 Misión personal secreta: Los archivos de Frederick",start:"a",nodes:{
 a:{say:"Frederick deja una carpeta mordisqueada a tus pies. Adentro: recordatorios del veterinario en servilletas, un horario de comida que vive en la cabeza de tres personas, y 40 fotos majestuosas sin publicar. Este perro necesita un sistema.",
    codex:"Las operaciones personales son disciplina de PM con menos riesgo: una sola fuente de verdad, recordatorios recurrentes para todo lo cíclico (comida, veterinario, peluquería), y una lista compartida. Si se repite, lleva recordatorio — la memoria no es un sistema.",
    q:"¿Cómo organizas la vida de Frederick?",
    ch:[{t:"Una nota gigante pegada al refrigerador",out:{r:"mid",concept:"Fuente única de verdad",why:"SÍ es una sola fuente — pero nada le recuerda nada a nadie, y la cita del veterinario muere el día que alguien necesita el refrigerador. Medio crédito.",beat:"Frederick olfatea la nota. No le impresiona."}},
        {t:"Un calendario compartido con recordatorios recurrentes + una lista común",next:"b"},
        {t:"Contratar un asistente para el perro",out:{r:"bad",concept:"Fuente única de verdad",why:"Un asistente para la agenda de un perro es una línea de nómina para un problema que resuelven dos recordatorios recurrentes.",beat:"Marcus aparece de la nada. «¿Un QUÉ para el perro?»"}}]},
 b:{say:"Su público espera. Cuarenta fotos majestuosas, cero publicaciones. ¿El plan de contenido de Frederick?",
    codex:"El trabajo creativo se hace por lotes: una sesión que produce un mes de contenido le gana a publicar cuando te acuerdas. La IA redacta los pies de foto; un humano aprueba antes de publicar — Frederick no puede aprobar, es un perro.",
    q:"El plan de contenido es…",
    ch:[{t:"Publicar cuando te acuerdes",out:{r:"mid",concept:"Lotes y programación",why:"Así va todo ahora — 40 fotos, cero publicaciones. El esfuerzo esporádico pierde contra un calendario aburrido, siempre. Medio crédito por honestidad.",beat:"Los fans de Frederick actualizan la página en vano."}},
        {t:"Día de lote mensual: la IA redacta, tú apruebas, un programador publica",out:{r:"ok",concept:"Lotes y programación",why:"Una hora al mes, la IA escribe, el humano conserva el criterio, el programador se encarga de recordar. La marca de Frederick: consistente.",beat:"La primera publicación programada llega a 200 me-gusta. Frederick sigue humilde."}},
        {t:"Dejar que la IA publique como Frederick, sin supervisión",out:{r:"bad",concept:"Lotes y programación",why:"El auto-posteo sin supervisión es como mueren las marcas. Sin revisión no hay piso.",beat:"En menos de una hora, la cuenta de Frederick promociona una cripto-estafa."}}]}}};
const FQ=()=>lang==="es"?FQES:FQEN;
const QEN=[
 {npc:"tovar",title:"The 500-doc chatbot",start:"a",nodes:{
  a:{say:"Store managers call me all day with policy questions. I want a chatbot on these 500 docs — and corporate rewrites them every month.",
     codex:"Two ways to give a model knowledge: train it into the model itself (slow, costly, frozen once done) — or keep it in a searchable index the model reads at answer time, fresh the moment a doc updates.",
     q:"The docs change monthly. Where does the knowledge live?",
     ch:[{t:"Train a custom model on the docs",out:{r:"bad",concept:"RAG vs fine-tuning",why:"Monthly retraining chases stale docs with money. By the time training finishes, corporate has rewritten the manual.",beat:"Priya, quietly: “That's how we lost the last lead.”"}},
         {t:"Index the docs; the bot retrieves the right pages per question",next:"b"},
         {t:"Paste all 500 docs into every prompt",out:{r:"bad",concept:"RAG vs fine-tuning",why:"You'd pay for 500 documents on every single question — and models lose focus across enormous inputs anyway.",beat:"Marcus materializes holding a calculator. Ominously."}}]},
  b:{say:"Indexing — good. One more thing: yesterday a manager asked about a policy that isn't in any document at all. What should the bot do?",
     codex:"A grounded bot answers only from retrieved text. When retrieval comes back empty, the honest moves are admitting it or routing to a human — the dangerous move is letting the model improvise.",
     q:"No matching document exists. The bot should…",
     ch:[{t:"Answer anyway from general knowledge — it usually sounds right",out:{r:"bad",concept:"Grounding & refusal",why:"“Sounds right” is how Free Churro Friday happens. An ungated answer with no source is a hallucination waiting for a customer.",beat:"Camila, from three desks away: “Don't you dare.”"}},
         {t:"Say “I don't have that policy” and route the question to the ops team",out:{r:"ok",concept:"Grounding & refusal",why:"A grounded bot that admits the gap — and hands a human the question — builds trust and shows ops which docs are missing.",beat:"The ops director nods slowly. “The bot knows what it doesn't know. Unlike my nephew.”"}},
         {t:"Make the bot apologize and end the chat",out:{r:"mid",concept:"Grounding & refusal",why:"Safe, but a dead end — no human routing means the manager's real question dies in the chat. Half credit: nothing false, nothing helpful.",beat:"Shipped with incidents. The manager calls the ops director anyway."}}]}}},
 {npc:"camila",title:"Free Churro Friday",start:"a",nodes:{
  a:{say:"The pilot bot just promised a manager ‘Free Churro Friday — all locations.’ That policy does not exist. Managers are already asking about it.",
     codex:"Models generate plausible text — when they don't know, plausible means invented. Asking nicely or lowering randomness reduces variety, not fabrication. What works: answers may only come from retrieved documents, with a citation.",
     q:"How do you kill the imaginary churros?",
     ch:[{t:"Add “don't make things up” to the instructions",out:{r:"mid",concept:"Hallucination control",why:"It helps at the margins — and fails the day it matters. Instructions nudge; they don't gate. Half credit for trying the cheap fix first.",beat:"The bot invents ‘Taco Tuesday Amnesty’ a week later."}},
         {t:"Set randomness to zero",out:{r:"bad",concept:"Hallucination control",why:"Temperature zero makes the bot confidently wrong the same way every time. Determinism isn't truth.",beat:"Camila: “Now it promises churros CONSISTENTLY.”"}},
         {t:"Ground every answer in retrieved text — no source, no answer",out:{r:"ok",concept:"Hallucination control",why:"Grounding treats the cause: the bot states only what a real document says, cites it, or admits it doesn't have the policy.",beat:"Camila drafts the official Death of Churro Friday memo. There is grief."}}]}}},
 {npc:"legal",title:"The 300-page contract",start:"a",nodes:{
  a:{say:"I need Q&A over the 300-page franchise agreement. The prototype nails page 20 and faceplants on page 200.",
     codex:"Every request has a token budget — you pay for every word sent, every time — and models attend unevenly across very long inputs: the middle sags. Less, better-chosen text beats everything-and-hope.",
     q:"How do you cover all 300 pages?",
     ch:[{t:"Chunk the contract; retrieve only sections relevant to each question",out:{r:"ok",concept:"Context windows & chunking",why:"Retrieval sends the three pages that matter instead of billing legal for all 300 every time — and quality holds on page 200 like it does on page 20.",beat:"Dana closes her laptop satisfied, which legal-ly speaking is a hug."}},
         {t:"Query a one-time summary instead",out:{r:"mid",concept:"Context windows & chunking",why:"Works for “what's the gist” — fails the clause-level questions contracts exist for. Half credit: fine as a companion, wrong as the answer.",beat:"Dana: “The summary says ‘standard terms apply.’ WHICH terms, bot?”"}},
         {t:"Buy a giant context window and send all 300 pages every time",out:{r:"bad",concept:"Context windows & chunking",why:"The middle still sags, and now every parking question costs a full contract's worth of tokens.",beat:"Marcus appears. He heard the word ‘buy.’"}}]}}},
 {npc:"marcus",title:"The morning report",start:"a",nodes:{
  a:{say:"Someone spends 40 minutes every morning pulling sales numbers, formatting the report, emailing leadership. Can your… robot… handle it?",
     codex:"A plain model call only writes text — it can't touch a database or send email. Hand it tools (run query, send email) and it can decide which tool, in what order: that's an agent. Fixed steps live in code; judgment lives in the model.",
     q:"How does the morning report automate?",
     ch:[{t:"One giant ‘do the report’ prompt",out:{r:"bad",concept:"Agents & tool use",why:"A beautiful report full of imaginary numbers — no tools, no data access, pure fiction in a spreadsheet costume.",beat:"Leadership compliments the formatting. Then reads the numbers."}},
         {t:"An agent with tools: query → format → send",out:{r:"ok",concept:"Agents & tool use",why:"Real data through real tools, orchestrated by the model. Forty minutes becomes zero.",beat:"Marcus: “If the robot breaks, it's coming out of your budget.” He's smiling. Probably."}},
         {t:"Tell Marcus robots aren't ready",out:{r:"bad",concept:"Agents & tool use",why:"They've been ready. The CFO asking you for automation is not the person to underdeliver to.",beat:"Marcus writes something in a small notebook. You don't like the notebook."}}]}}},
 {npc:"marcus",title:"The invoice",start:"a",nodes:{
  a:{say:"This invoice. Ten thousand support tickets a month, all answered by the most expensive model money can buy. Most of them ask where their order is.",
     codex:"Models come in sizes and prices; small ones do simple work for pennies. Systems can flag their own low-confidence answers — so easy tickets go cheap, and only hard ones escalate to the flagship.",
     q:"How do you cut the bill without cutting quality?",
     ch:[{t:"Everything to the cheapest model, accept the drop",out:{r:"mid",concept:"Model routing & cost design",why:"The bill collapses — and so does quality exactly on the hard tickets that decide whether customers stay. Half credit: right instinct, no escape hatch.",beat:"Refund disputes now answered by a model that thinks a churro is a shoe."}},
         {t:"Cheap model first; escalate hard or unsure tickets to premium",out:{r:"ok",concept:"Model routing & cost design",why:"The cheap model earns its keep on “where's my order”; the flagship earns its price on the gnarly 10%. Same quality where it matters, fraction of the spend.",beat:"Marcus initials the invoice. From Marcus, that's fireworks."}},
         {t:"Ask the vendor for a discount",out:{r:"bad",concept:"Model routing & cost design",why:"A discount on the wrong architecture is still the wrong architecture, now with a longer contract.",beat:"The vendor sends a fruit basket. Marcus sends it back."}}]}}},
 {npc:"priya",title:"The 98% quote-bot",start:"a",nodes:{
  a:{say:"Quote-bot is 98% right and auto-sends everything. Here's the other 2% — real customers, prices that lose real money. Sales loves it. Finance found the 2%.",
     codex:"Automation level should match cost-of-error: full auto where mistakes are cheap, human review where they're expensive. Confidence scores sort which is which — only the uncertain outputs wait for a person.",
     q:"Ship it, gate it, or kill it?",
     ch:[{t:"Ship — 98% is an A+",out:{r:"bad",concept:"Human-in-the-loop",why:"98% is an A+ on a quiz. On auto-sent pricing it's 200 wrong quotes a month, in dollars.",beat:"Finance starts a spreadsheet titled ‘The 2%.’ It has your name on it."}},
         {t:"Route uncertain quotes to human review",next:"b"},
         {t:"Kill it until perfect",out:{r:"bad",concept:"Human-in-the-loop",why:"Perfect never comes, and you just threw away the 98% that was printing time savings.",beat:"Sales holds a small vigil."}}]},
  b:{say:"Agreed — review queue. Now the tree question: WHICH quotes wait for a human?",
     codex:"Reviewing everything recreates the manual job you automated. Reviewing nothing is where you started. The lever is the confidence threshold — plus the cost of the error type: a too-low price hurts more than a too-slow quote.",
     q:"What goes to the review queue?",
     ch:[{t:"Every quote — humans re-check all of it",out:{r:"mid",concept:"Confidence thresholds",why:"Safe but self-defeating: you've rebuilt the 40-hour job with extra steps. Half credit — no losses, no leverage.",beat:"The reviewer now reviews quotes about reviewing."}},
         {t:"Only low-confidence quotes and any quote above a price ceiling",out:{r:"ok",concept:"Confidence thresholds",why:"Confidence catches the model's own doubt; the price ceiling catches the expensive mistakes it's confidently wrong about. Two nets, minimal drag.",beat:"Sales keeps its speed, finance keeps its sleep, Priya almost smiles."}},
         {t:"A random 10% sample",out:{r:"mid",concept:"Confidence thresholds",why:"Sampling measures error rate — it doesn't stop errors. Fine for monitoring, wrong as the only gate. Half credit.",beat:"The 2% waves at you from the un-sampled 90%."}}]}}},
 {npc:"cto",title:"Bayview's notes",start:"a",nodes:{
  a:{say:"Our doctors drown in paperwork. I want AI summaries of visit notes — but every note is full of patient data, and I need to not end up in the news.",
     codex:"Health data is regulated. Two keys make LLM work possible: mask patient identifiers before the model sees text, and use an enterprise endpoint covered by a signed agreement (BAA) that permits health data. Consumer AI endpoints are never covered.",
     q:"How do you deliver the summaries?",
     ch:[{t:"Send raw notes to a consumer AI tool",out:{r:"bad",concept:"PII/PHI governance",why:"That's the career-ending option — a reportable breach with a timestamp.",beat:"Somewhere, a compliance officer wakes in a cold sweat, unsure why."}},
         {t:"Mask identifiers + BAA-covered endpoint + log everything",out:{r:"ok",concept:"PII/PHI governance",why:"The model sees only what it needs, on infrastructure that's allowed to see it, with an audit trail. The standard, defensible path.",beat:"Dr. Okafor: “Finally. Someone who's done this in healthcare before.”"}},
         {t:"Refuse: AI can't touch health data",out:{r:"mid",concept:"PII/PHI governance",why:"Zero risk, zero help — and someone less careful will say yes instead. Half credit for caution without craft.",beat:"The doctors keep drowning, but compliantly."}}]}}},
 {npc:"junior",title:"Theo's prompt",start:"a",nodes:{
  a:{say:"I reworded the support bot's prompt and the demo got WAY better! Can we ship today? Please? I already told my mom.",
     codex:"One good demo is an anecdote. Prompt changes routinely fix one case and silently break five others. Teams keep an eval set — real past cases with known good answers — and score every change against it before shipping. Unit tests, but for AI.",
     q:"Does Theo's prompt ship today?",
     ch:[{t:"Ship it — you both saw it improve",out:{r:"bad",concept:"Evals & regression testing",why:"The demo showed one case. The eval would have shown the two refund flows it broke. Now customers get to find them.",beat:"Theo's mom is proud. The refund queue is not."}},
         {t:"Run the eval set; ship tomorrow if the score holds",out:{r:"ok",concept:"Evals & regression testing",why:"One hour of eval catches what demos hide — it finds two broken refund cases. Theo ships tomorrow, correctly, and learns the ritual.",beat:"Theo buys Priya coffee for a week. Growth arc initiated."}},
         {t:"Ask another AI which prompt is better",out:{r:"mid",concept:"Evals & regression testing",why:"AI-as-judge is a real technique — inside an eval harness with defined criteria. As a vibes oracle, it's a coin with opinions. Half credit.",beat:"The judge model says both prompts are “great!” It says that about everything."}}]}}},
 {npc:"tovar",title:"The laminated plan",start:"a",nodes:{
  a:{say:"One more thing — managers want meeting transcription inside the app. Theo has a six-month plan to build speech-to-text from scratch. He laminated it.",
     codex:"Some AI capabilities are commodities — transcription, translation, OCR — sold as excellent APIs for cents. Differentiation lives in what your product does with the output, not in rebuilding the commodity.",
     q:"Six months to build, or…?",
     ch:[{t:"Build speech-to-text from scratch",out:{r:"bad",concept:"Build vs buy",why:"Six months rebuilding what costs cents per minute, to reach quality the API already beats. Nobody will notice — except Marcus.",beat:"The lamination was the best part of the plan."}},
         {t:"Integrate a proven transcription API; build the features on top",out:{r:"ok",concept:"Build vs buy",why:"Two weeks to integrate, then the team builds what managers actually asked for — the stuff on top of the transcript. Build the last mile, buy the commodity.",beat:"Theo un-laminates the plan. Quietly."}},
         {t:"Hire human transcribers",out:{r:"bad",concept:"Build vs buy",why:"Slower, costlier, and doesn't scale past the third meeting. It's 2026.",beat:"The job posting gets three applicants. All bots."}}]}}},
 {npc:"ceo",title:"The 8-second silence",start:"a",nodes:{
  a:{say:"Final demo. Your phone agent gives brilliant answers… eight seconds after callers stop talking. I counted. Twice. Callers hang up.",
     codex:"In real-time AI, people judge time-to-first-word, not time-to-full-answer. Two levers: stream the reply so speech starts as it generates, and open with a small fast model while heavier reasoning catches up behind it.",
     q:"Kill the eight-second silence:",
     ch:[{t:"Wait for faster hardware",out:{r:"bad",concept:"Latency engineering",why:"Latency is a design problem you can fix this sprint, not a hardware problem someone else fixes next year.",beat:"The CEO checks his watch a third time. It echoes."}},
         {t:"Stream the reply; lead with a small fast model",next:"b"},
         {t:"Add hold music",out:{r:"bad",concept:"Latency engineering",why:"Now it's eight seconds of jazz before the disappointment.",beat:"Camila vetoes the smooth-jazz license request."}}]},
  b:{say:"Priya, patching it live: “Streaming's in. Last call — what's the metric on the launch dashboard?”",
     codex:"You get what you measure. Total answer time hides the fix; time-to-first-word is what callers actually feel — with total time and answer quality tracked beside it, not instead of it.",
     q:"The headline latency metric is…",
     ch:[{t:"Average total response time",out:{r:"mid",concept:"Latency metrics",why:"Real but wrong headline — a slow-but-streaming answer FEELS instant, and this metric can't see that. Half credit; keep it secondary.",beat:"The dashboard says ‘slower.’ The callers say ‘finally.’"}},
         {t:"Time-to-first-word",out:{r:"ok",concept:"Latency metrics",why:"That's the moment the silence ends — the thing callers judge. Track total time and quality beside it, headline this.",beat:"Sub-second. The CEO puts his watch away. Priya smiles. Witnesses confirm."}},
         {t:"Number of callers who hang up",out:{r:"mid",concept:"Latency metrics",why:"A great outcome metric — but it's a lagging alarm, not a steering wheel. Half credit.",beat:"“Good news: hang-ups down. Bad news: we learned it a week late.”"}}]}}},
 {npc:"rosa",title:"The phone never stops",start:"a",nodes:{
  a:{say:"Mijo, the phone rings all day — orders, questions, “¿tienen birria?” I miss half the calls while I'm cooking. They tell me a robot can answer. Fine. But can it take orders WITHOUT ruining them?",
     codex:"A voice agent can take phone orders — the trick is structure. Speech gets matched into a structured order (items, sizes, extras, price) against the real menu, then read back to the caller to confirm before it counts. Free-text guessing is how you end up with three surprise birrias.",
     q:"How should the phone agent take orders?",
     ch:[{t:"Let it chat freely and write down what it hears",out:{r:"bad",concept:"Structured outputs",why:"Free text means “large horchata” becomes “¿la orchata grande?” becomes mystery tickets. No structure, no reliable kitchen ticket.",beat:"Ticket #4 reads “birria??? maybe 3?”. The kitchen weeps."}},
         {t:"Match every order to the real menu as structured items, then read it back to confirm",next:"b"},
         {t:"Keep missing calls — it's more authentic",out:{r:"bad",concept:"Structured outputs",why:"Missed calls are missed revenue — a third of Rosa's orders come by phone.",beat:"Across town, a competitor's robot says “gracias por su orden.”"}},
         {t:"Hire someone just to answer the phone",out:{r:"mid",concept:"Structured outputs",why:"A human works — at a salary, with breaks, quitting at the worst moment. A real option, a heavy cost for a solvable problem. Half credit.",beat:"The new hire quits after one Saturday rush."}}]},
  b:{say:"It works, mijo! But last night someone asked for “the wedding catering package for 200 people” — and the robot happily said YES. We do not do weddings.",
     codex:"Agents need explicit guardrails: what they may sell, ceilings on order size, and a rule that unusual requests get handed to a human. Confirmation protects the customer; guardrails protect Rosa.",
     q:"Fix the robot's enthusiasm:",
     ch:[{t:"Menu-only + a max order size + route anything unusual to Rosa's phone",out:{r:"ok",concept:"Agent guardrails",why:"Sell only what exists, up to sane limits, and escalate the weird stuff to a human. Rosa decides about weddings — not the robot.",beat:"The robot politely transfers a quinceañera inquiry. Rosa negotiates like a champion."}},
         {t:"Turn the robot off at night",out:{r:"mid",concept:"Agent guardrails",why:"That dodges the failure by dodging the revenue. Half credit — safe, but small.",beat:"The night owls order pizza instead. Traitors."}},
         {t:"Let it improvise — the customer is always right",out:{r:"bad",concept:"Agent guardrails",why:"An agent without limits will promise 200 birrias and a mariachi. The cost of error is unbounded.",beat:"Somewhere, Marcus feels a disturbance he cannot explain."}},
         {t:"Make the robot upsell everything to boost revenue",out:{r:"bad",concept:"Agent guardrails",why:"An agent optimizing revenue without limits torches trust — what it may OFFER is a guardrail decision too.",beat:"An abuelita ordering one coffee gets offered the party platter. Twice."}}]}}},
 {npc:"chuy",title:"Prep for Friday",start:"a",nodes:{
  a:{say:"Every Friday I guess how much barbacoa to prep. Guess low — we run out by 8pm and people cry. Guess high — Sunday me eats sad leftovers for three days. There has to be a better way, ¿no?",
     codex:"Forecasting beats gut feeling: average the last several Fridays, adjust for what's different this week (payday, weather, events), and track how wrong you were to improve each week. Overproduction is money in the trash; running out is customers in the trash.",
     q:"How much barbacoa for Friday?",
     ch:[{t:"Same as always — feel it out",out:{r:"mid",concept:"Demand forecasting",why:"The gut got Chuy this far — sometimes right, never measured, impossible to improve. Half credit for surviving on instinct.",beat:"Friday, 8:15pm: “no hay.” Hearts break audibly."}},
         {t:"Average the last 8 Fridays, adjust for payday and weather, track the error weekly",out:{r:"ok",concept:"Demand forecasting",why:"A simple forecast plus error tracking gets smarter every single week. This is data science in an apron.",beat:"Chuy tapes the forecast to the walk-in. It becomes law."}},
         {t:"Double everything and sell leftovers Saturday",out:{r:"bad",concept:"Demand forecasting",why:"Waste as a strategy — the margin dies quietly in the walk-in fridge.",beat:"A tower of Sunday barbacoa. Even Frederick, visiting, declines."}},
         {t:"Buy a big AI forecasting platform first",out:{r:"mid",concept:"Demand forecasting",why:"Tools before data discipline is backwards — the simple average with error tracking wins until the data earns a platform. Half credit.",beat:"The platform's onboarding call runs longer than Friday service."}}]}}},
 {npc:"guero",title:"The estimate",start:"a",nodes:{
  a:{say:"Jefe! A client wants a remodel quote for a storefront across town. She sent thirty photos and wants the number TODAY. Old days, I'd drive over, measure for two hours, and guess the rest. You're the AI person — impress me.",
     codex:"Vision models can read measurements from photos: wall areas, fixtures, damage, materials. The reliable pattern is AI-drafted line items from the photos — quantities, materials, labor — with a human checking prices and the weird corners before it goes out. Fast AND defensible.",
     q:"How does the quote get built?",
     ch:[{t:"Eyeball the photos and quote from experience",out:{r:"mid",concept:"Vision estimates",why:"Experience is real — but unmeasured guesses win jobs that lose money. Half credit for the gray hairs.",beat:"Don Güero's mustache twitches. He knows you're right."}},
         {t:"AI drafts a line-item estimate from the photos; Güero verifies materials and prices before it ships",next:"b"},
         {t:"Promise to beat any other quote, figure it out later",out:{r:"bad",concept:"Vision estimates",why:"Winning on price without knowing your costs is how construction companies die with full calendars.",beat:"Lupe, without looking up: “That's how the last company went down.”"}},
         {t:"Send an apprentice to measure everything by hand today",out:{r:"mid",concept:"Vision estimates",why:"Accurate — and slow. The quote lands late, and late quotes lose. Half credit for rigor without speed.",beat:"The apprentice measures beautifully. The client signed elsewhere at noon."}}]},
  b:{say:"We won the job, jefe! But now the client says: “while you're at it, just add one little bathroom.” ONE LITTLE BATHROOM. What do I tell her?",
     codex:"Scope changes are where jobs bleed. The discipline is the change order: every addition gets written up with its price and schedule impact, approved BEFORE the work happens. AI drafts it in minutes from the original estimate — no awkwardness, just paper.",
     q:"The “one little bathroom” gets…",
     ch:[{t:"Just do it — keep the client happy",out:{r:"bad",concept:"Change orders",why:"Free bathrooms today, bankruptcy mañana. Unpaid scope is the quiet killer of good crews.",beat:"The crew builds it beautifully. Nobody pays for it."}},
         {t:"A written change order — price and timeline impact, AI-drafted, client-approved before work starts",out:{r:"ok",concept:"Change orders",why:"The AI turns the estimate into a change order in minutes; the client signs knowing exactly what it costs. Everyone stays friends AND solvent.",beat:"The client signs. Don Güero frames the change order like a diploma."}},
         {t:"Refuse all changes — the contract is the contract",out:{r:"mid",concept:"Change orders",why:"Protects the margin, loses the relationship — and remodels ALWAYS change. Half credit for spine, zero for flexibility.",beat:"The client calls someone else for the next job. And the next."}},
         {t:"Do it, and quietly add it to the final invoice",out:{r:"bad",concept:"Change orders",why:"Surprise charges are how trust — and occasionally court dates — get lost and found. Paper first, work second.",beat:"The final invoice starts a shouting match in two languages."}}]}}},
 {npc:"lupe",title:"Permit purgatory",start:"a",nodes:{
  a:{say:"Three projects are sitting dead because the permits aren't filed. Same forms, same city, every time — owner info, scope, drawings list, fees. I spend my Sundays copying the same data into the same boxes. There has to be dignity somewhere in this.",
     codex:"Repetitive paperwork is document automation's home turf: the project data already exists, so AI can fill the standard forms from it and track each permit's status. The human reviews before filing — a wrong permit is worse than a slow one.",
     q:"How do the permits get done?",
     ch:[{t:"Find a guy who knows a guy at the city",out:{r:"bad",concept:"Document automation",why:"The guy retires, the shortcut becomes a scandal, and the projects stay dead. Not a system.",beat:"The guy's cousin quotes a “consulting fee.” Lupe hangs up."}},
         {t:"AI fills the forms from the project data, Lupe reviews before filing, a tracker follows each permit's status",out:{r:"ok",concept:"Document automation",why:"The data exists once, the forms fill themselves, the human signs off, and nothing gets lost in purgatory again. Sundays return to Lupe.",beat:"Three permits filed by lunch. Lupe takes an actual weekend. The city is confused."}},
         {t:"Keep doing them by hand — it's tradition",out:{r:"mid",concept:"Document automation",why:"It works, slowly, and eats the estimator who should be estimating. Half credit for reliability, at the cost of Sundays.",beat:"Lupe's coffee goes cold over form B-247. Again."}},
         {t:"Outsource all permits to a consulting firm",out:{r:"mid",concept:"Document automation",why:"It works — at a fee, forever, and the capability never comes in-house. Half credit: delegated, not solved.",beat:"The consultant uses the same AI tool. Lupe watches, invoiced."}}]}}},
 {npc:"priya",title:"Say it so it's true",start:"a",nodes:{
  a:{say:"The support bot's answers SOUND great — confident, polished, wrong maybe one time in ten. Nobody can tell which time. Marketing loves the tone. I hate the tone. Fix the wording.",
     codex:"Trust is built with calibrated language: instructions that make the bot cite its source, mark uncertain answers as uncertain, and say 'I don't know' when nothing supports an answer. 'Be accurate' is a vibe — cite, qualify, and refuse are behaviors.",
     q:"What goes in the bot's instructions?",
     ch:[{t:"Write “be accurate and helpful” at the top",out:{r:"mid",concept:"Calibrated language",why:"A vibe, not a behavior. Models follow concrete verbs; “be accurate” measures nothing. Half credit — harmless, useless.",beat:"The bot stays confidently wrong, but now politely."}},
         {t:"Cite the source for every claim, mark uncertain answers as uncertain, and say “I don't know” when nothing supports it",next:"b"},
         {t:"Make it sound MORE confident — customers like certainty",out:{r:"bad",concept:"Calibrated language",why:"Confident wording on wrong answers is how trust dies at scale. That's polishing the failure.",beat:"Marketing applauds. Camila opens a new spreadsheet."}},
         {t:"Append a legal disclaimer to every answer",out:{r:"mid",concept:"Calibrated language",why:"Cover isn't candor — by the third message, users are trained to skip it. Half credit for lawyer instincts.",beat:"Users scroll past the disclaimer at record speed. All of them."}}]},
  b:{say:"Better. Now the live one: a caller asks “how many locations take the app?” — retrieval finds nothing current. The bot has to say SOMETHING. Word it.",
     codex:"When you can't verify, the trustworthy shape is: state what you CAN confirm, name what you can't, and hand over the path to the answer. Precision about your own limits is what accuracy sounds like.",
     q:"The bot's best reply is…",
     ch:[{t:"“Around 300 locations!” — probably close",out:{r:"bad",concept:"Verifiable claims",why:"A confident guess is a lie with good posture. One wrong number unravels every right one that came before it.",beat:"It was 41. A journalist was on the line."}},
         {t:"“I can't verify the current count. As of the last update it was 38 — here's where the live list is.”",out:{r:"ok",concept:"Verifiable claims",why:"Confirms the known, names the unknown, hands over the path. That wording IS the trust product.",beat:"Priya reads it twice. “Ship the wording.” The highest praise she knows."}},
         {t:"“I cannot answer that question.”",out:{r:"mid",concept:"Verifiable claims",why:"Honest but lazy — refusing everything unverifiable throws away the partial truth you DO have. Half credit.",beat:"The caller asks a human, who reads them the same last update."}},
         {t:"Answer normally, tuck “estimates may vary” at the end",out:{r:"mid",concept:"Verifiable claims",why:"Uncertainty in the footnote is certainty in the headline. Placement is part of wording. Half credit.",beat:"Nobody reads footnote three. Ever."}}]}}},
 {npc:"xochi",title:"The collar drop",start:"a",nodes:{
  a:{say:"Ah, the AI person! Look — La Obra builds the barrio, I dress it. I want a collar line for the neighborhood's pets: Frederick, Canela, the whole cast. I can sketch, but these AI image tools… how do we DESIGN with them without losing the craft?",
     codex:"Image models are variation engines, not designers. The working pattern: the designer sets the brief, AI generates dozens of directions, the human curates and refines the winners — and a pick only becomes real once it's a structured spec (a tech pack): materials, measurements, colorways. Taste stays human; the machine does volume.",
     q:"How does the collar line get designed?",
     ch:[{t:"One prompt, first image, straight to production",out:{r:"bad",concept:"AI-assisted design",why:"No curation, no spec, no sizes — a first output is a mood, not a product. Production needs measurements, not vibes.",beat:"The sample arrives sized for a horse. Frederick declines to comment."}},
         {t:"AI generates variations against Xochi's brief; she curates, and the pick becomes a tech pack — materials, sizes, colorways",next:"b"},
         {t:"Copy that famous designer's collar and have AI restyle it a little",out:{r:"bad",concept:"IP & originality",why:"A restyled copy is still a copy — legally radioactive and creatively hollow. AI makes imitation faster, not legal, and the barrio deserves its own look.",beat:"Dana appears in the Studio doorway holding a cease-and-desist. Just so you know what one looks like."}},
         {t:"Hand-sketch everything like always, no AI",out:{r:"mid",concept:"AI-assisted design",why:"The craft is real and the taste is the point — but one designer exploring five directions by hand loses to the same designer curating fifty. Half credit for standards.",beat:"Week two: three beautiful sketches, ninety unexplored ideas."}}]},
  b:{say:"The tech pack came out gorgeous. Now the launch — these are virtual fits for the town's pets. How do we ship the line?",
     codex:"Curation is quality control for creative goods. Small drops with a human QA pass — does every piece fit every body it's sold for? — keep a catalog worth browsing. Auto-generating infinite listings floods the shelf with slop, and “free everything forever” just means the work can't continue.",
     q:"The drop strategy is…",
     ch:[{t:"Small curated drops; every piece checked on every pet body before listing",out:{r:"ok",concept:"Curation as QA",why:"Each drop is small enough to check and special enough to want. The eval mindset, applied to fashion: test on every body shape before it ships.",beat:"Drop one sells out by sunset. Frederick models the gold collar with unbearable dignity."}},
         {t:"Auto-generate and auto-list new items daily",out:{r:"bad",concept:"Curation as QA",why:"An infinite uncurated catalog is a landfill with a search bar. Nobody browses slop twice.",beat:"Item #4,072 is a collar with three buckles and no hole. A confused pigeon already bought it."}},
         {t:"Everything free, forever, for everyone",out:{r:"mid",concept:"Curation as QA",why:"Generous — and unsustainable. Free is a launch tactic, not a plan; the line dies when the work can't pay for itself. Half credit for heart.",beat:"Month two: Xochi quietly takes a mural commission to fund collar three."}}]}}}
];
const QES=[
 {npc:"tovar",title:"El chatbot de 500 documentos",start:"a",nodes:{
  a:{say:"Los gerentes de tienda me llaman todo el día con preguntas de políticas. Quiero un chatbot sobre estos 500 documentos — y corporativo los reescribe cada mes.",
     codex:"Dos formas de darle conocimiento a un modelo: entrenarlo dentro del modelo (lento, caro, congelado al terminar) — o mantenerlo en un índice consultable que el modelo lee al responder, fresco al instante en que un documento se actualiza.",
     q:"Los documentos cambian cada mes. ¿Dónde vive el conocimiento?",
     ch:[{t:"Entrenar un modelo a medida con los documentos",out:{r:"bad",concept:"RAG vs fine-tuning",why:"Reentrenar cada mes es perseguir documentos viejos con dinero. Para cuando termina el entrenamiento, corporativo ya reescribió el manual.",beat:"Priya, en voz baja: «Así perdimos al líder anterior»."}},
         {t:"Indexar los documentos; el bot recupera las páginas correctas por pregunta",next:"b"},
         {t:"Pegar los 500 documentos en cada prompt",out:{r:"bad",concept:"RAG vs fine-tuning",why:"Pagarías por 500 documentos en cada pregunta — y los modelos pierden el foco en entradas enormes.",beat:"Marcus se materializa con una calculadora. De forma ominosa."}}]},
  b:{say:"Indexar — bien. Una cosa más: ayer un gerente preguntó por una política que no existe en ningún documento. ¿Qué debe hacer el bot?",
     codex:"Un bot anclado responde solo desde texto recuperado. Cuando la búsqueda vuelve vacía, lo honesto es admitirlo o derivar a un humano — lo peligroso es dejar que el modelo improvise.",
     q:"No existe documento que coincida. El bot debería…",
     ch:[{t:"Responder igual con conocimiento general — suele sonar bien",out:{r:"bad",concept:"Anclaje y rechazo",why:"«Suena bien» es como nace el Viernes de Churros Gratis. Una respuesta sin fuente es una alucinación esperando a un cliente.",beat:"Camila, a tres escritorios: «Ni se te ocurra»."}},
         {t:"Decir «no tengo esa política» y derivar la pregunta al equipo de operaciones",out:{r:"ok",concept:"Anclaje y rechazo",why:"Un bot que admite el hueco — y le pasa la pregunta a un humano — genera confianza y muestra qué documentos faltan.",beat:"El director asiente lento. «El bot sabe lo que no sabe. No como mi sobrino»."}},
         {t:"Que el bot pida disculpas y termine el chat",out:{r:"mid",concept:"Anclaje y rechazo",why:"Seguro, pero sin salida — sin derivación humana, la pregunta real muere en el chat. Medio crédito: nada falso, nada útil.",beat:"Entregado con incidentes. El gerente llama al director de todos modos."}}]}}},
 {npc:"camila",title:"Viernes de Churros Gratis",start:"a",nodes:{
  a:{say:"El bot piloto le acaba de prometer a un gerente el «Viernes de Churros Gratis — todas las sucursales». Esa política no existe. Los gerentes ya están preguntando.",
     codex:"Los modelos generan texto plausible — y cuando no saben, plausible significa inventado. Pedirlo por favor o bajar la aleatoriedad reduce variedad, no fabricación. Lo que funciona: las respuestas solo pueden venir de documentos recuperados, con cita.",
     q:"¿Cómo matas los churros imaginarios?",
     ch:[{t:"Agregar «no inventes cosas» a las instrucciones",out:{r:"mid",concept:"Control de alucinaciones",why:"Ayuda en los márgenes — y falla el día que importa. Las instrucciones empujan; no bloquean. Medio crédito por probar primero lo barato.",beat:"El bot inventa la «Amnistía del Martes de Tacos» una semana después."}},
         {t:"Poner la aleatoriedad en cero",out:{r:"bad",concept:"Control de alucinaciones",why:"Con temperatura cero el bot se equivoca con confianza, igual, todas las veces. Determinismo no es verdad.",beat:"Camila: «Ahora promete churros CONSISTENTEMENTE»."}},
         {t:"Anclar cada respuesta en texto recuperado — sin fuente, no hay respuesta",out:{r:"ok",concept:"Control de alucinaciones",why:"El anclaje ataca la causa: el bot dice solo lo que un documento real dice, lo cita, o admite que no tiene esa política.",beat:"Camila redacta el memo oficial de la Muerte del Viernes de Churros. Hay luto."}}]}}},
 {npc:"legal",title:"El contrato de 300 páginas",start:"a",nodes:{
  a:{say:"Necesito preguntas y respuestas sobre el contrato de franquicia de 300 páginas. El prototipo brilla en la página 20 y se estrella en la 200.",
     codex:"Cada solicitud tiene un presupuesto de tokens — pagas cada palabra enviada, cada vez — y los modelos atienden de forma dispareja las entradas muy largas: el medio se hunde. Menos texto, mejor elegido, le gana a mandarlo todo.",
     q:"¿Cómo cubres las 300 páginas?",
     ch:[{t:"Trocear el contrato; recuperar solo las secciones relevantes por pregunta",out:{r:"ok",concept:"Ventanas de contexto",why:"La recuperación envía las tres páginas que importan en vez de cobrarle a legal las 300 cada vez — y la calidad aguanta en la página 200 igual que en la 20.",beat:"Dana cierra su laptop satisfecha, lo que en términos legales es un abrazo."}},
         {t:"Consultar un resumen único del contrato",out:{r:"mid",concept:"Ventanas de contexto",why:"Sirve para «la idea general» — falla en las preguntas de cláusula por las que existen los contratos. Medio crédito: bien de acompañante, mal de respuesta.",beat:"Dana: «El resumen dice ‘aplican términos estándar’. ¿CUÁLES términos, bot?»."}},
         {t:"Comprar una ventana de contexto gigante y mandar las 300 páginas siempre",out:{r:"bad",concept:"Ventanas de contexto",why:"El medio se hunde igual, y ahora cada pregunta de estacionamiento cuesta un contrato entero en tokens.",beat:"Aparece Marcus. Escuchó la palabra «comprar»."}}]}}},
 {npc:"marcus",title:"El reporte matutino",start:"a",nodes:{
  a:{say:"Alguien gasta 40 minutos cada mañana sacando las ventas de ayer, formateando el reporte y enviándolo a dirección. ¿Puede tu… robot… hacerlo?",
     codex:"Una llamada simple al modelo solo escribe texto — no puede tocar una base de datos ni enviar correos. Dale herramientas (ejecutar consulta, enviar correo) y puede decidir cuál usar y en qué orden: eso es un agente. Los pasos fijos van en código; el criterio va en el modelo.",
     q:"¿Cómo se automatiza el reporte matutino?",
     ch:[{t:"Un mega-prompt de «haz el reporte»",out:{r:"bad",concept:"Agentes y herramientas",why:"Un reporte hermoso lleno de números imaginarios — sin herramientas no hay datos: pura ficción disfrazada de hoja de cálculo.",beat:"Dirección felicita el formato. Luego lee los números."}},
         {t:"Un agente con herramientas: consultar → formatear → enviar",out:{r:"ok",concept:"Agentes y herramientas",why:"Datos reales por herramientas reales, orquestado por el modelo. Cuarenta minutos se vuelven cero.",beat:"Marcus: «Si el robot se rompe, sale de tu presupuesto». Sonríe. Probablemente."}},
         {t:"Decirle a Marcus que los robots no están listos",out:{r:"bad",concept:"Agentes y herramientas",why:"Llevan tiempo listos. El CFO que te pide automatización no es la persona a la que conviene quedarle mal.",beat:"Marcus anota algo en una libretita. No te gusta la libretita."}}]}}},
 {npc:"marcus",title:"La factura",start:"a",nodes:{
  a:{say:"Esta factura. Diez mil tickets de soporte al mes, todos respondidos por el modelo más caro del mercado. La mayoría pregunta dónde está su pedido.",
     codex:"Hay modelos de varios tamaños y precios; los pequeños hacen el trabajo simple por centavos. Los sistemas pueden marcar sus propias respuestas de baja confianza — lo fácil va al modelo barato y solo lo difícil escala al premium.",
     q:"¿Cómo bajas la factura sin bajar la calidad?",
     ch:[{t:"Todo al modelo más barato, aceptar la caída",out:{r:"mid",concept:"Enrutamiento y costos",why:"La factura colapsa — y la calidad también, justo en los tickets difíciles que deciden si el cliente se queda. Medio crédito: buen instinto, sin salida de emergencia.",beat:"Las disputas de reembolso ahora las responde un modelo que cree que un churro es un zapato."}},
         {t:"Modelo barato primero; escalar lo difícil o dudoso al premium",out:{r:"ok",concept:"Enrutamiento y costos",why:"El barato se gana el pan con «¿dónde está mi pedido?»; el premium justifica su precio solo en el 10% espinoso. Misma calidad donde importa, fracción del gasto.",beat:"Marcus firma la factura. Viniendo de Marcus, son fuegos artificiales."}},
         {t:"Pedirle un descuento al proveedor",out:{r:"bad",concept:"Enrutamiento y costos",why:"Un descuento sobre la arquitectura equivocada sigue siendo la arquitectura equivocada, ahora con contrato más largo.",beat:"El proveedor manda una canasta de frutas. Marcus la devuelve."}}]}}},
 {npc:"priya",title:"El bot del 98%",start:"a",nodes:{
  a:{say:"El bot de cotizaciones acierta el 98% y envía todo solo. Aquí está el otro 2% — clientes reales, precios que pierden dinero real. A ventas le encanta. Finanzas encontró el 2%.",
     codex:"El nivel de automatización debe seguir el costo del error: automático donde equivocarse es barato, revisión humana donde es caro. Los puntajes de confianza separan cuál es cuál — solo lo dudoso espera a una persona.",
     q:"¿Lo lanzas, lo controlas o lo matas?",
     ch:[{t:"Lanzarlo — 98% es un diez",out:{r:"bad",concept:"Humano en el circuito",why:"98% es un diez en un examen. En precios auto-enviados son 200 cotizaciones malas al mes, en dinero real.",beat:"Finanzas abre una hoja de cálculo titulada «El 2%». Lleva tu nombre."}},
         {t:"Enviar las cotizaciones dudosas a revisión humana",next:"b"},
         {t:"Matarlo hasta que sea perfecto",out:{r:"bad",concept:"Humano en el circuito",why:"Perfecto nunca llega, y acabas de tirar el 98% que ahorraba horas todos los días.",beat:"Ventas hace una pequeña vigilia."}}]},
  b:{say:"De acuerdo — cola de revisión. Ahora la pregunta del árbol: ¿QUÉ cotizaciones esperan a un humano?",
     codex:"Revisarlo todo recrea el trabajo manual que automatizaste. No revisar nada es donde empezaste. La palanca es el umbral de confianza — más el costo del tipo de error: un precio demasiado bajo duele más que una cotización lenta.",
     q:"¿Qué va a la cola de revisión?",
     ch:[{t:"Todas — humanos revisan todo de nuevo",out:{r:"mid",concept:"Umbrales de confianza",why:"Seguro pero contraproducente: reconstruiste el trabajo de 40 horas con pasos extra. Medio crédito — sin pérdidas, sin palanca.",beat:"El revisor ahora revisa cotizaciones sobre revisar."}},
         {t:"Solo las de baja confianza y cualquiera sobre un tope de precio",out:{r:"ok",concept:"Umbrales de confianza",why:"La confianza captura la duda del modelo; el tope de precio captura los errores caros de los que está confiadamente equivocado. Dos redes, mínima fricción.",beat:"Ventas conserva su velocidad, finanzas su sueño, y Priya casi sonríe."}},
         {t:"Una muestra aleatoria del 10%",out:{r:"mid",concept:"Umbrales de confianza",why:"Muestrear mide la tasa de error — no detiene errores. Bien para monitorear, mal como única barrera. Medio crédito.",beat:"El 2% te saluda desde el 90% sin muestrear."}}]}}},
 {npc:"cto",title:"Las notas de Bayview",start:"a",nodes:{
  a:{say:"Nuestros médicos se ahogan en papeleo. Quiero resúmenes con IA de las notas de visita — pero cada nota está llena de datos de pacientes, y necesito no salir en las noticias.",
     codex:"Los datos de salud están regulados. Dos llaves hacen posible trabajar con LLM: enmascarar identificadores antes de que el modelo vea el texto, y usar un endpoint empresarial cubierto por un acuerdo firmado (BAA) que permite datos de salud. Los endpoints de consumo nunca están cubiertos.",
     q:"¿Cómo entregas los resúmenes?",
     ch:[{t:"Mandar las notas crudas a una IA de consumo",out:{r:"bad",concept:"Gobernanza de datos",why:"Esa es la opción que termina carreras — una brecha reportable con marca de tiempo.",beat:"En algún lugar, un oficial de cumplimiento despierta sudando frío, sin saber por qué."}},
         {t:"Enmascarar identificadores + endpoint cubierto por BAA + registrar todo",out:{r:"ok",concept:"Gobernanza de datos",why:"El modelo ve solo lo necesario, en infraestructura autorizada a verlo, con rastro de auditoría. El camino estándar y defendible.",beat:"Dr. Okafor: «Por fin. Alguien que ya hizo esto en salud»."}},
         {t:"Negarse: la IA no puede tocar datos de salud",out:{r:"mid",concept:"Gobernanza de datos",why:"Cero riesgo, cero ayuda — y alguien menos cuidadoso dirá que sí. Medio crédito por cautela sin oficio.",beat:"Los médicos siguen ahogándose, pero en regla."}}]}}},
 {npc:"junior",title:"El prompt de Theo",start:"a",nodes:{
  a:{say:"¡Cambié el prompt del bot de soporte y el demo mejoró MUCHÍSIMO! ¿Podemos lanzar hoy? ¿Porfa? Ya le dije a mi mamá.",
     codex:"Un buen demo es una anécdota. Los cambios de prompt arreglan un caso y rompen cinco en silencio. Los equipos mantienen un set de evaluación — casos reales con respuestas correctas conocidas — y puntúan cada cambio antes de lanzar. Tests unitarios, pero para IA.",
     q:"¿El prompt de Theo se lanza hoy?",
     ch:[{t:"Lanzarlo — ambos lo vieron mejorar",out:{r:"bad",concept:"Evaluaciones y regresión",why:"El demo mostró un caso. La evaluación habría mostrado los dos flujos de reembolso que rompió. Ahora los encontrarán los clientes.",beat:"La mamá de Theo está orgullosa. La cola de reembolsos no."}},
         {t:"Correr el set de evaluación; lanzar mañana si el puntaje aguanta",out:{r:"ok",concept:"Evaluaciones y regresión",why:"Una hora de evaluación atrapa lo que los demos esconden — encuentra dos casos de reembolso rotos. Theo lanza mañana, correctamente, y aprende el ritual.",beat:"Theo le compra café a Priya por una semana. Arco de crecimiento iniciado."}},
         {t:"Preguntarle a otra IA cuál prompt es mejor",out:{r:"mid",concept:"Evaluaciones y regresión",why:"IA-como-juez es una técnica real — dentro de un arnés de evaluación con criterios definidos. Como oráculo de intuiciones, es una moneda con opiniones. Medio crédito.",beat:"El modelo juez dice que ambos prompts están «¡geniales!». Lo dice de todo."}}]}}},
 {npc:"tovar",title:"El plan enmicado",start:"a",nodes:{
  a:{say:"Una cosa más — los gerentes quieren transcripción de reuniones en la app. Theo tiene un plan de seis meses para construir voz-a-texto desde cero. Lo enmicó.",
     codex:"Algunas capacidades de IA son commodities — transcripción, traducción, OCR — vendidas como APIs excelentes por centavos. La diferenciación vive en lo que tu producto hace con el resultado, no en reconstruir el commodity.",
     q:"¿Seis meses para construirlo, o…?",
     ch:[{t:"Construir voz-a-texto desde cero",out:{r:"bad",concept:"Construir vs comprar",why:"Seis meses reconstruyendo lo que cuesta centavos por minuto, para alcanzar una calidad que la API ya supera. Nadie lo notará — excepto Marcus.",beat:"Lo enmicado era lo mejor del plan."}},
         {t:"Integrar una API probada de transcripción; construir las funciones encima",out:{r:"ok",concept:"Construir vs comprar",why:"Dos semanas para integrar, y el equipo construye lo que los gerentes pidieron — lo que va sobre la transcripción. Construye la última milla, compra el commodity.",beat:"Theo des-enmica el plan. En silencio."}},
         {t:"Contratar transcriptores humanos",out:{r:"bad",concept:"Construir vs comprar",why:"Más lento, más caro, y no escala pasada la tercera reunión. Estamos en 2026.",beat:"La vacante recibe tres postulaciones. Todas de bots."}}]}}},
 {npc:"ceo",title:"El silencio de 8 segundos",start:"a",nodes:{
  a:{say:"Demo final. Tu agente telefónico da respuestas brillantes… ocho segundos después de que el cliente deja de hablar. Los conté. Dos veces. La gente cuelga.",
     codex:"En IA en tiempo real, la gente juzga el tiempo hasta la primera palabra, no el tiempo de la respuesta completa. Dos palancas: transmitir la respuesta en streaming para que empiece a hablar mientras se genera, y abrir con un modelo pequeño y rápido mientras lo pesado alcanza por detrás.",
     q:"Mata el silencio de ocho segundos:",
     ch:[{t:"Esperar hardware más rápido",out:{r:"bad",concept:"Ingeniería de latencia",why:"La latencia es un problema de diseño que arreglas este sprint, no un problema de hardware que otro arregla el año que viene.",beat:"El CEO mira su reloj por tercera vez. Hace eco."}},
         {t:"Streaming en la respuesta; abrir con un modelo pequeño y rápido",next:"b"},
         {t:"Poner música de espera",out:{r:"bad",concept:"Ingeniería de latencia",why:"Ahora son ocho segundos de jazz antes de la decepción.",beat:"Camila veta la licencia de smooth jazz."}}]},
  b:{say:"Priya, parchando en vivo: «El streaming quedó. Última llamada — ¿qué métrica va en el tablero de lanzamiento?»",
     codex:"Obtienes lo que mides. El tiempo total esconde el arreglo; el tiempo hasta la primera palabra es lo que la gente siente — con el tiempo total y la calidad al lado, no en su lugar.",
     q:"La métrica principal de latencia es…",
     ch:[{t:"Tiempo total promedio de respuesta",out:{r:"mid",concept:"Métricas de latencia",why:"Real, pero titular equivocado — una respuesta lenta en streaming SE SIENTE instantánea, y esta métrica no lo ve. Medio crédito; déjala como secundaria.",beat:"El tablero dice «más lento». Los clientes dicen «por fin»."}},
         {t:"Tiempo hasta la primera palabra",out:{r:"ok",concept:"Métricas de latencia",why:"Es el momento en que el silencio termina — lo que la gente juzga. Mide el tiempo total y la calidad al lado; titula con esta.",beat:"Menos de un segundo. El CEO guarda el reloj. Priya sonríe. Hay testigos."}},
         {t:"Número de personas que cuelgan",out:{r:"mid",concept:"Métricas de latencia",why:"Gran métrica de resultado — pero es una alarma tardía, no un volante. Medio crédito.",beat:"«Buenas noticias: caen los cuelgues. Malas: lo supimos una semana tarde»."}}]}}},
 {npc:"rosa",title:"El teléfono no para",start:"a",nodes:{
  a:{say:"Mijo, el teléfono suena todo el día — pedidos, preguntas, «¿tienen birria?». Pierdo la mitad de las llamadas mientras cocino. Dicen que un robot puede contestar. Bueno. ¿Pero puede tomar pedidos SIN arruinarlos?",
     codex:"Un agente de voz puede tomar pedidos por teléfono — el truco es la estructura. Lo hablado se convierte en un pedido estructurado (platillos, tamaños, extras, precio) contra el menú real, y se lo lee de vuelta al cliente para confirmar antes de que cuente. Adivinar con texto libre es como terminas con tres birrias sorpresa.",
     q:"¿Cómo debe tomar pedidos el agente telefónico?",
     ch:[{t:"Que converse libremente y anote lo que escuche",out:{r:"bad",concept:"Salidas estructuradas",why:"Texto libre significa que «horchata grande» se vuelve «¿la orchata grande?» se vuelve tickets misteriosos. Sin estructura no hay comanda confiable.",beat:"El ticket #4 dice «birria??? ¿3 quizás?». La cocina llora."}},
         {t:"Emparejar cada pedido con el menú real como items estructurados, y leerlo de vuelta para confirmar",next:"b"},
         {t:"Seguir perdiendo llamadas — es más auténtico",out:{r:"bad",concept:"Salidas estructuradas",why:"Llamadas perdidas son ingresos perdidos — un tercio de los pedidos de Rosa llegan por teléfono.",beat:"Al otro lado de la ciudad, el robot de la competencia dice «gracias por su orden»."}},
         {t:"Contratar a alguien solo para contestar el teléfono",out:{r:"mid",concept:"Salidas estructuradas",why:"Un humano funciona — con sueldo, descansos, y renuncias en el peor momento. Opción real, costo pesado para un problema resoluble. Medio crédito.",beat:"La nueva contratación renuncia tras un solo sábado en friega."}}]},
  b:{say:"¡Funciona, mijo! Pero anoche alguien pidió «el paquete de banquete de bodas para 200 personas» — y el robot dijo que SÍ, feliz de la vida. Nosotros no hacemos bodas.",
     codex:"Los agentes necesitan límites explícitos: qué pueden vender, topes de tamaño de pedido, y la regla de pasarle a un humano cualquier solicitud inusual. La confirmación protege al cliente; los límites protegen a Rosa.",
     q:"Arregla el entusiasmo del robot:",
     ch:[{t:"Solo menú + tope de pedido + lo inusual va al teléfono de Rosa",out:{r:"ok",concept:"Límites del agente",why:"Vender solo lo que existe, hasta límites sensatos, y escalar lo raro a un humano. De las bodas decide Rosa — no el robot.",beat:"El robot transfiere cortésmente una consulta de quinceañera. Rosa negocia como campeona."}},
         {t:"Apagar el robot de noche",out:{r:"mid",concept:"Límites del agente",why:"Esquiva el error esquivando también los ingresos. Medio crédito — seguro, pero pequeño.",beat:"Los noctámbulos piden pizza. Traidores."}},
         {t:"Que improvise — el cliente siempre tiene la razón",out:{r:"bad",concept:"Límites del agente",why:"Un agente sin límites prometerá 200 birrias y un mariachi. El costo del error no tiene techo.",beat:"En algún lugar, Marcus siente una perturbación que no puede explicar."}},
         {t:"Que el robot ofrezca extras en todo para subir ventas",out:{r:"bad",concept:"Límites del agente",why:"Un agente optimizando ingresos sin límites quema la confianza — lo que puede OFRECER también es decisión de límites.",beat:"Una abuelita que pide un café recibe oferta del paquete de fiesta. Dos veces."}}]}}},
 {npc:"chuy",title:"La prep del viernes",start:"a",nodes:{
  a:{say:"Cada viernes adivino cuánta barbacoa preparar. Si le atino bajo — se acaba a las 8 y la gente llora. Si le atino alto — el Chuy del domingo come sobras tristes tres días. Tiene que haber una mejor manera, ¿no?",
     codex:"Pronosticar le gana al instinto: promedia los últimos viernes, ajusta por lo distinto de esta semana (quincena, clima, eventos), y registra qué tan equivocado estuviste para mejorar cada semana. Sobreproducir es dinero a la basura; quedarse sin producto es clientes a la basura.",
     q:"¿Cuánta barbacoa para el viernes?",
     ch:[{t:"Lo de siempre — al tanteo",out:{r:"mid",concept:"Pronóstico de demanda",why:"El instinto trajo a Chuy hasta aquí — a veces acierta, nunca se mide, imposible de mejorar. Medio crédito por sobrevivir al puro oficio.",beat:"Viernes, 8:15pm: «no hay». Se escuchan corazones romperse."}},
         {t:"Promediar los últimos 8 viernes, ajustar por quincena y clima, y registrar el error semanal",out:{r:"ok",concept:"Pronóstico de demanda",why:"Un pronóstico simple más registro del error se vuelve más listo cada semana. Esto es ciencia de datos con mandil.",beat:"Chuy pega el pronóstico en el refri. Se vuelve ley."}},
         {t:"Doblar todo y vender sobras el sábado",out:{r:"bad",concept:"Pronóstico de demanda",why:"El desperdicio como estrategia — el margen muere calladito en el cuarto frío.",beat:"Una torre de barbacoa dominical. Hasta Frederick, de visita, dice que no."}},
         {t:"Comprar primero una gran plataforma de pronósticos con IA",out:{r:"mid",concept:"Pronóstico de demanda",why:"Herramientas antes que disciplina de datos es al revés — el promedio simple con registro de error gana hasta que los datos ameriten plataforma. Medio crédito.",beat:"La llamada de implementación dura más que el servicio del viernes."}}]}}},
 {npc:"guero",title:"El presupuesto",start:"a",nodes:{
  a:{say:"¡Jefe! Una clienta quiere cotización para remodelar un local al otro lado de la ciudad. Mandó treinta fotos y quiere el número HOY. Antes, yo manejaba hasta allá, medía dos horas y adivinaba el resto. Tú eres el de la IA — impresióname.",
     codex:"Los modelos de visión pueden leer medidas desde fotos: áreas de muros, instalaciones, daños, materiales. El patrón confiable: la IA redacta las partidas desde las fotos — cantidades, materiales, mano de obra — y un humano verifica precios y rincones raros antes de enviarla. Rápido Y defendible.",
     q:"¿Cómo se arma la cotización?",
     ch:[{t:"Calcular a ojo desde las fotos, con experiencia",out:{r:"mid",concept:"Presupuestos con visión",why:"La experiencia es real — pero adivinar sin medir gana trabajos que pierden dinero. Medio crédito por las canas.",beat:"El bigote de Don Güero tiembla. Sabe que tienes razón."}},
         {t:"La IA redacta partidas desde las fotos; Güero verifica materiales y precios antes de enviar",next:"b"},
         {t:"Prometer ganarle a cualquier otra cotización y ya verás después",out:{r:"bad",concept:"Presupuestos con visión",why:"Ganar por precio sin conocer tus costos es como mueren las constructoras con la agenda llena.",beat:"Lupe, sin levantar la vista: «Así cayó la empresa pasada»."}},
         {t:"Mandar a un aprendiz a medir todo a mano hoy",out:{r:"mid",concept:"Presupuestos con visión",why:"Preciso — y lento. La cotización llega tarde, y las tardías pierden. Medio crédito por rigor sin velocidad.",beat:"El aprendiz mide precioso. La clienta firmó con otros al mediodía."}}]},
  b:{say:"¡Ganamos el trabajo, jefe! Pero ahora la clienta dice: «ya que están ahí, agréguenme un bañito». UN BAÑITO. ¿Qué le digo?",
     codex:"Los cambios de alcance son donde se desangran las obras. La disciplina es la orden de cambio: cada extra se escribe con su precio e impacto en el calendario, y se aprueba ANTES de trabajar. La IA la redacta en minutos desde el presupuesto original — sin pena, puro papel.",
     q:"El «bañito» se maneja con…",
     ch:[{t:"Hacerlo y ya — cliente contenta",out:{r:"bad",concept:"Órdenes de cambio",why:"Baños gratis hoy, quiebra mañana. El alcance no cobrado es el asesino silencioso de las buenas cuadrillas.",beat:"La cuadrilla lo construye precioso. Nadie lo paga."}},
         {t:"Orden de cambio escrita — precio e impacto en tiempo, redactada por IA, aprobada antes de trabajar",out:{r:"ok",concept:"Órdenes de cambio",why:"La IA convierte el presupuesto en orden de cambio en minutos; la clienta firma sabiendo exactamente qué cuesta. Todos quedan amigos Y solventes.",beat:"La clienta firma. Don Güero enmarca la orden de cambio como diploma."}},
         {t:"Negarse a todo cambio — el contrato es el contrato",out:{r:"mid",concept:"Órdenes de cambio",why:"Protege el margen, pierde la relación — y las remodelaciones SIEMPRE cambian. Medio crédito por carácter, cero por flexibilidad.",beat:"La clienta llama a otros para el siguiente trabajo. Y el siguiente."}},
         {t:"Hacerlo y colarlo calladito en la factura final",out:{r:"bad",concept:"Órdenes de cambio",why:"Los cobros sorpresa son como se pierde la confianza — y a veces se ganan citas en el juzgado. Primero papel, luego trabajo.",beat:"La factura final desata una discusión a gritos en dos idiomas."}}]}}},
 {npc:"lupe",title:"El purgatorio de permisos",start:"a",nodes:{
  a:{say:"Tres proyectos están muertos porque los permisos no se han metido. Los mismos formularios, la misma ciudad, cada vez — datos del dueño, alcance, lista de planos, cuotas. Me gasto los domingos copiando los mismos datos en las mismas casillas. En algún lugar de esto debe haber dignidad.",
     codex:"El papeleo repetitivo es la cancha del automatizado de documentos: los datos del proyecto ya existen, así que la IA puede llenar los formularios estándar y seguir el estado de cada permiso. El humano revisa antes de presentar — un permiso mal hecho es peor que uno lento.",
     q:"¿Cómo se resuelven los permisos?",
     ch:[{t:"Buscar a un conocido que conoce a alguien en el municipio",out:{r:"bad",concept:"Automatización de documentos",why:"El conocido se jubila, el atajo se vuelve escándalo, y los proyectos siguen muertos. Eso no es un sistema.",beat:"El primo del conocido cotiza una «cuota de consultoría». Lupe cuelga."}},
         {t:"La IA llena los formularios desde los datos del proyecto, Lupe revisa antes de presentar, y un tablero sigue cada permiso",out:{r:"ok",concept:"Automatización de documentos",why:"Los datos existen una vez, los formularios se llenan solos, el humano firma, y nada vuelve a perderse en el purgatorio. Los domingos regresan a Lupe.",beat:"Tres permisos presentados antes del almuerzo. Lupe toma un fin de semana de verdad. El municipio está confundido."}},
         {t:"Seguir a mano — es la tradición",out:{r:"mid",concept:"Automatización de documentos",why:"Funciona, lento, y se come a la presupuestista que debería estar presupuestando. Medio crédito por confiable, al costo de los domingos.",beat:"El café de Lupe se enfría sobre el formulario B-247. Otra vez."}},
         {t:"Tercerizar todos los permisos a una consultora",out:{r:"mid",concept:"Automatización de documentos",why:"Funciona — con honorarios, para siempre, y la capacidad nunca llega a casa. Medio crédito: delegado, no resuelto.",beat:"La consultora usa la misma herramienta de IA. Lupe observa, facturada."}}]}}},
 {npc:"priya",title:"Dilo para que sea verdad",start:"a",nodes:{
  a:{say:"Las respuestas del bot de soporte SUENAN geniales — seguras, pulidas, equivocadas una de cada diez veces. Nadie sabe cuál. A marketing le encanta el tono. Yo odio el tono. Arregla la redacción.",
     codex:"La confianza se construye con lenguaje calibrado: instrucciones que hacen que el bot cite su fuente, marque lo incierto como incierto, y diga «no lo sé» cuando nada respalda la respuesta. «Sé preciso» es una vibra — citar, matizar y rehusar son conductas.",
     q:"¿Qué va en las instrucciones del bot?",
     ch:[{t:"Escribir «sé preciso y útil» al inicio",out:{r:"mid",concept:"Lenguaje calibrado",why:"Una vibra, no una conducta. Los modelos siguen verbos concretos; «sé preciso» no mide nada. Medio crédito — inofensivo, inútil.",beat:"El bot sigue equivocándose con confianza, pero ahora con cortesía."}},
         {t:"Citar la fuente de cada afirmación, marcar lo incierto como incierto, y decir «no lo sé» cuando nada lo respalda",next:"b"},
         {t:"Que suene MÁS seguro — a los clientes les gusta la certeza",out:{r:"bad",concept:"Lenguaje calibrado",why:"Redacción segura sobre respuestas equivocadas es como muere la confianza a escala. Eso es pulir el fracaso.",beat:"Marketing aplaude. Camila abre una hoja de cálculo nueva."}},
         {t:"Agregar un descargo legal a cada respuesta",out:{r:"mid",concept:"Lenguaje calibrado",why:"Cubrirse no es sincerarse — al tercer mensaje, los usuarios ya aprendieron a saltárselo. Medio crédito por instinto de abogado.",beat:"Los usuarios pasan el descargo a velocidad récord. Todos."}}]},
  b:{say:"Mejor. Ahora la de verdad: alguien llama y pregunta «¿cuántas sucursales aceptan la app?» — la búsqueda no encuentra nada actual. El bot tiene que decir ALGO. Redáctalo.",
     codex:"Cuando no puedes verificar, la forma confiable es: afirmar lo que SÍ puedes confirmar, nombrar lo que no, y entregar el camino a la respuesta. La precisión sobre tus propios límites es a lo que suena la exactitud.",
     q:"La mejor respuesta del bot es…",
     ch:[{t:"«¡Unas 300 sucursales!» — seguro le atina",out:{r:"bad",concept:"Afirmaciones verificables",why:"Una suposición con confianza es una mentira con buena postura. Un número equivocado desteje todos los correctos anteriores.",beat:"Eran 41. En la línea había una periodista."}},
         {t:"«No puedo verificar el número actual. Al último corte eran 38 — aquí está la lista en vivo.»",out:{r:"ok",concept:"Afirmaciones verificables",why:"Confirma lo conocido, nombra lo desconocido, entrega el camino. Esa redacción ES el producto de confianza.",beat:"Priya lo lee dos veces. «Publica esa redacción.» El mayor elogio que conoce."}},
         {t:"«No puedo responder esa pregunta.»",out:{r:"mid",concept:"Afirmaciones verificables",why:"Honesto pero flojo — rehusar todo lo no verificable tira la verdad parcial que SÍ tienes. Medio crédito.",beat:"La persona le pregunta a un humano, que le lee el mismo último corte."}},
         {t:"Responder normal y esconder «las cifras pueden variar» al final",out:{r:"mid",concept:"Afirmaciones verificables",why:"Incertidumbre en la letra chica es certeza en el titular. La ubicación también es redacción. Medio crédito.",beat:"Nadie lee la nota tres al pie. Nunca."}}]}}},
 {npc:"xochi",title:"El drop de collares",start:"a",nodes:{
  a:{say:"¡Ah, la persona de IA! Mira — La Obra construye el barrio, yo lo visto. Quiero una línea de collares para las mascotas del rumbo: Frederick, Canela, todo el elenco. Sé dibujar, pero estas herramientas de imágenes con IA… ¿cómo DISEÑAMOS con ellas sin perder el oficio?",
     codex:"Los modelos de imágenes son motores de variaciones, no diseñadores. El patrón que funciona: la diseñadora define el brief, la IA genera decenas de direcciones, el humano cura y refina las ganadoras — y la elegida solo se vuelve real cuando es una especificación estructurada (un tech pack): materiales, medidas, colores. El gusto sigue siendo humano; la máquina pone el volumen.",
     q:"¿Cómo se diseña la línea de collares?",
     ch:[{t:"Un prompt, la primera imagen, directo a producción",out:{r:"bad",concept:"Diseño asistido por IA",why:"Sin curaduría, sin especificación, sin tallas — una primera salida es un mood, no un producto. Producción necesita medidas, no vibras.",beat:"La muestra llega en talla caballo. Frederick se niega a comentar."}},
         {t:"La IA genera variaciones sobre el brief de Xochi; ella cura, y la elegida se vuelve tech pack — materiales, tallas, colores",next:"b"},
         {t:"Copiar el collar de esa diseñadora famosa y que la IA lo restilice un poco",out:{r:"bad",concept:"PI y originalidad",why:"Una copia restilizada sigue siendo una copia — radiactiva en lo legal y hueca en lo creativo. La IA hace la imitación más rápida, no legal, y el barrio merece su propio estilo.",beat:"Dana aparece en la puerta del Estudio con un cese y desista. Solo para que sepas cómo se ve uno."}},
         {t:"Dibujar todo a mano como siempre, sin IA",out:{r:"mid",concept:"Diseño asistido por IA",why:"El oficio es real y el gusto es el punto — pero una diseñadora explorando cinco direcciones a mano pierde contra la misma curando cincuenta. Medio crédito por los estándares.",beat:"Semana dos: tres bocetos hermosos, noventa ideas sin explorar."}}]},
  b:{say:"El tech pack quedó precioso. Ahora el lanzamiento — son atuendos virtuales para las mascotas del pueblo. ¿Cómo sacamos la línea?",
     codex:"La curaduría es control de calidad para bienes creativos. Drops pequeños con revisión humana — ¿cada pieza le queda a cada cuerpo para el que se vende? — mantienen un catálogo que vale la pena. Auto-generar publicaciones infinitas inunda el estante de basura, y «todo gratis para siempre» solo significa que el trabajo no puede continuar.",
     q:"La estrategia del drop es…",
     ch:[{t:"Drops pequeños y curados; cada pieza probada en cada cuerpo antes de publicarse",out:{r:"ok",concept:"Curaduría como QA",why:"Cada drop es lo bastante pequeño para revisarse y lo bastante especial para desearse. La mentalidad de evals, aplicada a la moda: se prueba en cada tipo de cuerpo antes de salir.",beat:"El primer drop se agota antes del atardecer. Frederick modela el collar dorado con una dignidad insoportable."}},
         {t:"Auto-generar y auto-publicar artículos nuevos a diario",out:{r:"bad",concept:"Curaduría como QA",why:"Un catálogo infinito sin curar es un basurero con buscador. Nadie navega la basura dos veces.",beat:"El artículo #4,072 es un collar con tres hebillas y ningún agujero. Ya lo compró una paloma confundida."}},
         {t:"Todo gratis, para siempre, para todos",out:{r:"mid",concept:"Curaduría como QA",why:"Generoso — e insostenible. Lo gratis es táctica de lanzamiento, no un plan; la línea muere cuando el trabajo no se paga solo. Medio crédito por el corazón.",beat:"Mes dos: Xochi acepta un mural en silencio para financiar el collar tres."}}]}}}
];
const UI={
 en:{

function auditReach(){

  const walk=(id,x,y)=>{const w=WORLDS[id];return !(x<0||y<0||x>=w.W||y>=w.H||SOLID.has(w.grid[y][x])||w.grid[y][x]==="N");};

  while(q.length){const[idw,x,y]=q.shift();
    const ch=WORLDS[idw].rows[y][x];
    if(PORTALS[idw]&&PORTALS[idw][ch]){const p=PORTALS[idw][ch],key=p.x+","+p.y;
      if(!seen[p.to].has(key)&&walk(p.to,p.x,p.y)){seen[p.to].add(key);q.push([p.to,p.x,p.y]);}}
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,key=nx+","+ny;
      if(!seen[idw].has(key)&&walk(idw,nx,ny)){seen[idw].add(key);q.push([idw,nx,ny]);}});}
  Object.entries(WORLDS).forEach(([id,w])=>{
    if(seen[id].size===0)return; /* world locked behind a not-yet-built portal (e.g. the Studio pre-completion) — audited once it opens */
    w.npcs.forEach(n=>{const ok=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>seen[id].has((n.x+dx)+","+(n.y+dy)));
      if(!ok)probs.push("NPC unreachable: "+n.npc+" in "+id);});
    let un=0;
    for(let y=0;y<w.H;y++)for(let x=0;x<w.W;x++)if(walk(id,x,y)&&!seen[id].has(x+","+y))un++;

  });

}

const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function tryStep(){
  if(moving||!held)return;
  if(performance.now()<warpT)return;
  dir=held;const[dx,dy]=DIRS[held],nx=px+dx,ny=py+dy;
  if(isSolid(nx,ny)){
    const w=CW();
    const ch=(ny>=0&&ny<w.H&&nx>=0&&nx<w.W)?w.rows[ny][nx]:"#";
    const F=T().flavor;
    if(F[ch]&&Date.now()-lastBump>1800){lastBump=Date.now();
      toast(F[ch][Math.floor(Math.random()*F[ch].length)],2000);}
    return;
  }
  moving=true;mt=0;px=nx;py=ny;
}
let last=0;
function loop(ts){
  const dt=Math.min(50,ts-last);last=ts;
  if(moving){
    mt+=dt/240;bob+=dt/70;
    if(mt>=1){moving=false;fx=px;fy=py;
      const pch=CW().rows[py][px];
      if(ts>portalT&&PORTALS[world]&&PORTALS[world][pch]){const p=PORTALS[world][pch];
        world=p.to;px=fx=p.x;py=fy=p.y;held=null;dir=p.dir||"down";
        warpT=performance.now()+450;portalT=performance.now()+900;
        save();setWorldTag();toast(T().arrive[world],2200);}
      else if(pch==="Y"&&ts>portalT){portalT=performance.now()+900;held=null;openTravel();}
      else{save();checkTalk();tryStep();}
    }
    else{const[dx,dy]=DIRS[dir];fx=px-dx*(1-mt);fy=py-dy*(1-mt);}
  }else tryStep();
  dogUpdate(dt,ts);catUpdate(dt,ts);pigUpdate(dt,ts);loroTick(ts);fredCheck();
  if(!$("world").hidden)draw();
  requestAnimationFrame(loop);
}

  const retry=!solved&&hearts>0?`<p class="beat">${cur>=0?T().retryNote:T().retryNoteFred}</p>`:"";

   lives on-device like a Game Boy battery save; the pass is the link cable).

const b64u=s2=>btoa(unescape(encodeURIComponent(s2))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=s2=>decodeURIComponent(escape(atob(s2.replace(/-/g,"+").replace(/_/g,"/"))));
function passURL(){
  save();
  const blob={v:1,l:lang,s:loadSave()};
  return location.href.replace(/#.*$/,"")+"#save="+b64u(JSON.stringify(blob)); /* href, not origin — file:// has origin "null" */
}
function readPass(){
  const m=location.hash.match(/#save=([A-Za-z0-9\-_]+)/);
  if(!m)return null;
  try{const j=JSON.parse(unb64u(m[1]));
    if(j&&j.v===1){j.s=sanitizeSave(j.s);j.l=j.l==="es"?"es":"en";
      if(j.s)return j;}}catch(e){}

}

function setTile(x,y,ch){
  const w=CW();
  if(x<=0||y<=0||x>=w.W-1||y>=w.H-1)return;
  if(w.grid[y][x]==="N")return;
  if(PORTALS[world]&&PORTALS[world][w.rows[y][x]])return; /* never paint over stairs/exits */
  if(w.rows[y][x]==="Y")return; /* nor the trolley stop — transit infrastructure is sacred */
  const prev=w.rows[y][x];
  w.rows[y]=w.rows[y].slice(0,x)+ch+w.rows[y].slice(x+1);
  w.grid[y][x]=ch;
  try{const ed=JSON.parse(localStorage.getItem("mqedits")||"[]");ed.push({m:world,x,y,ch,prev});
    localStorage.setItem("mqedits",JSON.stringify(ed.slice(-400)));}catch(e){}

  const back=(e2.prev!==undefined&&e2.prev!==null)?e2.prev:w.rows0[e2.y][e2.x];
  w.rows[e2.y]=w.rows[e2.y].slice(0,e2.x)+back+w.rows[e2.y].slice(e2.x+1);
  if(w.grid[e2.y][e2.x]!=="N")w.grid[e2.y][e2.x]=back;
  try{localStorage.setItem("mqedits",JSON.stringify(ed));}catch(e){}
