<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSP: scripts only from this site (inline allowed — the game is one inline script);
     connections same-origin only. When NET goes live, its server origin must be added
     to connect-src. GitHub Pages can't set headers, hence the meta tag. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14121B">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light dark}body{margin:0;padding:0}img{max-width:100%}</style>
<title>Meridian Quest</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  [hidden]{display:none !important;}
  :root{
    --bg:#F2F1EA; --surface:#FFFFFF; --ink:#221F2B; --muted:#635E6E; --line:#DAD7CB;
    --accent:#7A3FE0; --accent-ink:#FFFFFF; --gold:#B07A10; --gold-bg:#F5EAD2;
    --good:#1F7A4D; --good-bg:#E4F2E9; --bad:#B3372E; --bad-bg:#F7E7E4;
    --mid:#8A5A14; --mid-bg:#F5EBD9;
    --chip:#EBE9E0; --bubble:#EFEBF8; --bubble-line:#D4C7F1;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14121B; --surface:#1E1B29; --ink:#EAE7F0; --muted:#9C96AB; --line:#322D42;
      --accent:#A97FFF; --accent-ink:#160F26; --gold:#E0B45C; --gold-bg:#3A2F17;
      --good:#4CC38A; --good-bg:#173226; --bad:#E5695F; --bad-bg:#3A201D;
      --mid:#D9A85B; --mid-bg:#38301F;
      --chip:#292435; --bubble:#272138; --bubble-line:#453963;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14121B; --surface:#1E1B29; --ink:#EAE7F0; --muted:#9C96AB; --line:#322D42;
    --accent:#A97FFF; --accent-ink:#160F26; --gold:#E0B45C; --gold-bg:#3A2F17;
    --good:#4CC38A; --good-bg:#173226; --bad:#E5695F; --bad-bg:#3A201D;
    --mid:#D9A85B; --mid-bg:#38301F;
    --chip:#292435; --bubble:#272138; --bubble-line:#453963;
  }
  body{background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif; line-height:1.55;}
  .wrap{max-width:560px; margin:0 auto; padding:22px 16px 60px;}
  header{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px;}
  h1{font-family:'Unbounded',sans-serif; font-weight:700; font-size:1.2rem; margin:0;}
  h1 span{color:var(--accent);}
  .hud{display:flex; justify-content:space-between; align-items:center; gap:10px; font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--muted); margin-bottom:6px; font-variant-numeric:tabular-nums;}
  .hearts{letter-spacing:2px;}
  .xpbar{height:6px; background:var(--chip); border-radius:3px; overflow:hidden; margin-bottom:14px;}
  .xpbar div{height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:3px; transition:width .3s;}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); margin:0 0 12px;}
  .worldpanel{padding:12px;}
  .viewport{position:relative; border-radius:10px; overflow:hidden; background:#241F2E; touch-action:none;}
  .settings .box{touch-action:pan-y;}
  .tlsearch{display:flex; gap:8px; margin-bottom:10px;}
  .tlsearch input{flex:1; box-sizing:border-box; font-family:'IBM Plex Mono',monospace; font-size:.8rem; padding:8px 10px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink);}
  .tlsearch button{font-size:.8rem; padding:8px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer;}
  canvas{display:block; width:100%; image-rendering:pixelated;}
  .dpad{position:absolute; left:10px; bottom:10px; display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:2px; opacity:.92; touch-action:none; user-select:none;}
  .dpad button{border:none; border-radius:9px; background:rgba(20,16,30,.55); color:#EDE9F5; font-size:1.05rem; cursor:pointer; backdrop-filter:blur(2px); touch-action:none;}
  .dpad button:active{background:rgba(122,63,224,.75);}
  .dpad .blank{visibility:hidden;}
  .joy{position:absolute; left:12px; bottom:12px; width:116px; height:116px; touch-action:none; user-select:none;}
  .joybase{position:absolute; inset:0; border-radius:50%; background:rgba(20,16,30,.4); border:2px solid rgba(237,233,245,.25); backdrop-filter:blur(2px);}
  .knob{position:absolute; left:50%; top:50%; width:48px; height:48px; border-radius:50%; background:rgba(122,63,224,.85); border:2px solid rgba(237,233,245,.5); transform:translate(-50%,-50%); transition:transform .08s;}
  .gear{position:absolute; right:10px; top:10px; width:38px; height:38px; border-radius:10px; border:none; background:rgba(20,16,30,.55); color:#EDE9F5; font-size:1.05rem; cursor:pointer; z-index:4;}
  .gear svg{display:block; width:20px; height:20px; margin:auto; pointer-events:none;}
  #careForm input{box-sizing:border-box; min-width:0; font-family:'IBM Plex Sans',sans-serif; font-size:.85rem; padding:8px 10px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink);}
  .wdrow{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 12px;}
  .wdrow .sw{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0; background:var(--chip); color:var(--muted); font-size:.75rem; line-height:1;}
  .wdrow .sw[aria-pressed="true"]{border-color:var(--accent); outline:2px solid var(--accent); outline-offset:1px;}
  #wdpv{display:block; margin:0 auto 12px; width:132px; image-rendering:pixelated; background:#241F2E; border-radius:10px;}
  .fsbtn{right:54px !important;}
  .mapbtn{right:98px !important;}
  .vmap{display:flex; flex-direction:column; align-items:center; gap:2px; margin-bottom:14px; font-size:.78rem;}
  .vmap .vrow{display:flex; gap:6px; justify-content:center; width:100%;}
  .vmap .vm{border:1.5px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--bg); text-align:center; flex:1;}
  .vmap .vm.here{border-color:var(--accent); background:var(--accent); color:var(--accent-ink); font-weight:600;}
  .vmap .vlink{color:var(--muted); line-height:1.1;}
  .vmap .vm small{display:block; color:inherit; opacity:.78; font-size:.65rem;}
  .viewport.fs{position:fixed; inset:0; z-index:50; border-radius:0; display:flex; align-items:center; justify-content:center;}
  .viewport.fs canvas{width:100%; height:100% !important; object-fit:contain;}
  body.noscroll{overflow:hidden;}
  .status{position:absolute; left:10px; top:10px; background:rgba(20,16,30,.55); color:#EDE9F5; font-family:'IBM Plex Mono',monospace; font-size:.74rem; padding:5px 10px; border-radius:999px; pointer-events:none; z-index:4; letter-spacing:1px;}
  .brushes{position:absolute; left:50%; transform:translateX(-50%); top:54px; display:flex; flex-wrap:wrap; justify-content:center; max-width:88%; gap:5px; z-index:4; background:rgba(20,16,30,.55); padding:5px 7px; border-radius:12px;}
  .brushes button{width:44px; height:48px; border-radius:8px; border:1.5px solid transparent; background:rgba(237,233,245,.12); font-size:.95rem; cursor:pointer; padding:2px 0 0; display:flex; flex-direction:column; align-items:center; gap:1px; color:#EDE9F5;}
  .brushes button .bl{font-size:.5rem; letter-spacing:.03em; opacity:.85;}
  .brushes button[aria-pressed="true"]{border-color:#E0B45C; background:rgba(224,180,92,.25);}
  .talk{position:absolute; right:10px; bottom:16px; font-family:'Unbounded',sans-serif; font-size:.8rem; padding:12px 16px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-ink); cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.35);}
  .treat{bottom:72px !important; background:#B5773A !important; color:#FFF !important;}
  .hint{font-size:.8rem; color:var(--muted); margin:10px 2px 0;}
  .npc{display:flex; gap:10px; margin-bottom:12px;}
  .avatar{flex:0 0 auto; width:44px; height:44px; border-radius:50%; background:var(--chip); display:flex; align-items:center; justify-content:center; font-size:1.4rem;}
  .bubble{background:var(--bubble); border:1px solid var(--bubble-line); border-radius:4px 14px 14px 14px; padding:10px 13px;}
  .bubble b{display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--accent); margin-bottom:3px;}
  .bubble p{margin:0; font-size:.93rem;}
  .codex{background:var(--gold-bg); border:1px solid var(--gold); border-radius:10px; padding:11px 14px; margin:12px 0;}
  .codex b{display:block; font-family:'IBM Plex Mono',monospace; font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); margin-bottom:4px;}
  .codex p{margin:0; font-size:.88rem;}
  .q{font-size:1rem; font-weight:600; margin:12px 0;}
  .choices{display:flex; flex-direction:column; gap:10px;}
  .choices button{font-family:'IBM Plex Sans',sans-serif; font-size:.93rem; text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer;}
  .choices button:hover{border-color:var(--accent);}
  .choices button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .choices button:disabled{cursor:default; opacity:.88;}
  .choices button.right{border-color:var(--good); background:var(--good-bg);}
  .choices button.wrong{border-color:var(--bad); background:var(--bad-bg);}
  .choices button.midpick{border-color:var(--mid); background:var(--mid-bg);}
  .verdict{margin-top:14px; border-radius:10px; padding:13px;}
  .verdict.ok{background:var(--good-bg);} .verdict.no{background:var(--bad-bg);} .verdict.mid{background:var(--mid-bg);}
  .verdict h2{font-family:'Unbounded',sans-serif; font-size:.9rem; margin:0 0 6px;}
  .verdict.ok h2{color:var(--good);} .verdict.no h2{color:var(--bad);} .verdict.mid h2{color:var(--mid);}
  .verdict p{margin:0 0 7px; font-size:.9rem;}
  .verdict .beat{font-style:italic; color:var(--muted); font-size:.87rem;}
  .concept{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:.7rem; padding:3px 10px; border-radius:999px; background:var(--chip); color:var(--muted); margin-bottom:7px;}
  .levelup{margin-top:12px; text-align:center; font-family:'Unbounded',sans-serif; font-size:.82rem; color:var(--gold); background:var(--gold-bg); border:1px dashed var(--gold); border-radius:10px; padding:9px;}
  .btn{margin-top:14px; width:100%; font-family:'Unbounded',sans-serif; font-weight:500; font-size:.88rem; padding:12px; border-radius:10px; border:none; background:var(--accent); color:var(--accent-ink); cursor:pointer;}
  .btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .intro p{margin:.5rem 0; color:var(--muted); font-size:.94rem;}
  .intro p.lead{color:var(--ink); font-weight:500;}
  .classes{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .classes button{display:flex; gap:10px; align-items:center; text-align:left; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; font-family:'IBM Plex Sans',sans-serif;}
  .classes button:hover{border-color:var(--accent);}
  .classes button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .classes .ce{font-size:1.3rem;}
  .classes b{display:block; font-size:.92rem;}
  .classes small{color:var(--muted); font-size:.8rem;}
  .toast{position:absolute; left:50%; transform:translateX(-50%); bottom:64px; background:rgba(20,16,30,.85); color:#EDE9F5; font-size:.8rem; padding:8px 14px; border-radius:999px; max-width:86%; text-align:center; pointer-events:none; opacity:0; transition:opacity .25s; z-index:6;}
  .toast.on{opacity:1;}
  .creator label{display:block; font-family:'IBM Plex Mono',monospace; font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:4px;}
  .creator .row{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 14px;}
  .creator .sw{width:34px; height:34px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0;}
  .creator .sw[aria-pressed="true"]{border-color:var(--accent); outline:2px solid var(--accent); outline-offset:1px;}
  .creator input[type=text]{width:100%; box-sizing:border-box; font-family:'IBM Plex Sans',sans-serif; font-size:1rem; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); margin-bottom:14px;}
  .creator input[type=text]:focus-visible{outline:2px solid var(--accent); border-color:var(--accent);}
  .creator .preview{display:flex; justify-content:center; margin-bottom:10px;}
  .pvbox{position:relative; background:#F7F4EC; border:1px solid #D9D3C5; border-radius:12px; padding:8px 26px 4px;}
  .pvbox.dark{background:#241F2E; border-color:var(--line);}
  .pvtog{position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:8px; border:none; background:rgba(128,120,150,.28); cursor:pointer; font-size:.85rem; line-height:1; padding:0;}
  #pv{width:96px; height:156px; image-rendering:pixelated;}
  .opt{font-family:'IBM Plex Sans',sans-serif; font-size:.82rem; padding:8px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer;}
  .opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent); color:var(--accent-ink);}
  .settings{position:absolute; inset:0; background:rgba(15,12,22,.78); display:flex; align-items:center; justify-content:center; z-index:5;}
  .settings .box{background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:18px; width:82%; max-width:320px; max-height:88%; overflow-y:auto;}
  .settings h3{font-family:'Unbounded',sans-serif; font-size:.9rem; margin:0 0 12px;}
  .settings .optrow{display:flex; gap:8px; margin-bottom:14px;}
  .settings .optrow button{flex:1; font-family:'IBM Plex Sans',sans-serif; font-size:.85rem; padding:10px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer;}
  .settings .optrow button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent); color:var(--accent-ink);}
  .settings .close{width:100%; font-family:'Unbounded',sans-serif; font-size:.8rem; padding:10px; border-radius:10px; border:none; background:var(--accent); color:var(--accent-ink); cursor:pointer;}
  .settings label{display:block; font-family:'IBM Plex Mono',monospace; font-size:.66rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px;}
  .settings textarea{width:100%; box-sizing:border-box; height:220px; font-family:'IBM Plex Mono',monospace; font-size:.72rem; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); padding:10px; margin-bottom:12px;}
  .end h2{font-family:'Unbounded',sans-serif; font-size:1.05rem; margin:0 0 6px;}
  .end .final{font-family:'IBM Plex Mono',monospace; color:var(--accent); font-size:.88rem; margin:0 0 8px;}
  .end .epi{font-style:italic; color:var(--muted); font-size:.92rem; margin:0 0 12px;}
</style>
<div class="wrap">
  <header><h1>MERIDIAN <span>QUEST</span></h1></header>
  <div class="hud" id="hud" hidden><span id="ptag"></span><span class="hearts" id="hearts"></span><span id="xp"></span></div>
  <div class="xpbar" id="xpbarwrap" hidden><div id="xpfill"></div></div>

  <div class="panel intro" id="intro">
    <div class="codex" id="tpFound" hidden>
      <b id="tpFoundLb"></b><p id="tpFoundTx"></p>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="opt" id="tpBoard" style="flex:1;"></button>
        <button class="opt" id="tpSkip" style="flex:1;"></button>
      </div>
    </div>
    <p class="lead" id="in1"></p>
    <p id="in2"></p>
    <p id="in3"></p>
    <p class="lead" style="margin-top:14px;" id="in4"></p>
    <div class="classes" id="classes">
      <button data-c="architect"><span class="ce">🏗️</span><span><b></b><small></small></span></button>
      <button data-c="diplomat"><span class="ce">🤝</span><span><b></b><small></small></span></button>
      <button data-c="operator"><span class="ce">⚡</span><span><b></b><small></small></span></button>
    </div>
    <button class="btn" id="continueBtn" hidden></button>
    <div class="settings" id="introLangWrap" hidden></div>
    <p style="margin-top:12px;"><button class="opt" id="langQuick">🌐 Español</button></p>
  </div>

  <div class="panel creator" id="creator" hidden>
    <p class="eyebrow" id="crTitle"></p>
    <div class="preview"><div class="pvbox" id="pvbox"><canvas id="pv" width="48" height="78"></canvas><button class="pvtog" id="pvtog" aria-label="Toggle preview background">🌙</button></div></div>
    <label for="heroname" id="lbName"></label>
    <input type="text" id="heroname" maxlength="14" placeholder="Rookie">
    <label id="lbOutfit"></label><div class="row" id="rowOutfit"></div>
    <label id="lbShirt"></label><div class="row" id="rowShirt"></div>
    <label id="lbSkin"></label><div class="row" id="rowSkin"></div>
    <label id="lbHairC"></label><div class="row" id="rowHair"></div>
    <label id="lbHairS"></label><div class="row" id="rowStyle"></div>
    <button class="btn" id="begin"></button>
  </div>

  <div class="panel worldpanel" id="world" hidden>
    <p class="eyebrow" id="worldTag"></p>
    <div class="viewport" id="vp">
      <canvas id="cv"></canvas>
      <div class="dpad" id="dpad" hidden>
        <button class="blank"></button><button data-d="up" aria-label="Up">▲</button><button class="blank"></button>
        <button data-d="left" aria-label="Left">◀</button><button class="blank"></button><button data-d="right" aria-label="Right">▶</button>
        <button class="blank"></button><button data-d="down" aria-label="Down">▼</button><button class="blank"></button>
      </div>
      <div class="joy" id="joy" hidden><div class="joybase"></div><div class="knob" id="knob"></div></div>
      <button class="gear" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.8v3.1M12 18.1v3.1M2.8 12h3.1M18.1 12h3.1M5.5 5.5l2.2 2.2M16.3 16.3l2.2 2.2M18.5 5.5l-2.2 2.2M7.7 16.3l-2.2 2.2"/></svg></button>
      <button class="gear fsbtn" id="fsbtn" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="gear mapbtn" id="mapbtn" aria-label="Map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
      <div class="status" id="status"></div>
      <div class="brushes" id="brushes" hidden>
        <button data-b="."><span>⬜</span><span class="bl"></span></button>
        <button data-b="#"><span>🧱</span><span class="bl"></span></button>
        <button data-b="D"><span>🖥️</span><span class="bl"></span></button>
        <button data-b="P"><span>🪴</span><span class="bl"></span></button>
        <button data-b="R"><span>🟪</span><span class="bl"></span></button>
        <button data-b="+"><span>🚪</span><span class="bl"></span></button>
        <button data-b="T"><span>🍽️</span><span class="bl"></span></button>
        <button data-b="W"><span>🧊</span><span class="bl"></span></button>
        <button data-b="V"><span>🔥</span><span class="bl"></span></button>
        <button id="undoBtn"><span>↩️</span><span class="bl"></span></button>
      </div>
      <button class="talk" id="talk" hidden></button>
      <button class="talk treat" id="treat" hidden></button>
      <div class="toast" id="toast"></div>
      <div class="settings" id="settings" hidden>
        <div class="box">
          <h3 id="setTitle"></h3>
          <label id="lbCtl"></label>
          <div class="optrow">
            <button id="optSwipe"></button>
            <button id="optJoy"></button>
            <button id="optPad"></button>
          </div>
          <label id="lbLang"></label>
          <div class="optrow">
            <button id="optEn">English</button>
            <button id="optEs">Español</button>
          </div>
          <label id="lbAdm"></label>
          <div class="optrow">
            <button id="admOff"></button>
            <button id="admOn"></button>
          </div>
          <div class="optrow"><button id="openLab" style="flex:1;"></button></div>
          <div class="optrow"><button id="openExp" style="flex:1;"></button></div>
          <div class="optrow"><button id="openWd" style="flex:1;" hidden></button></div>
          <div class="optrow"><button id="openTp" style="flex:1;"></button></div>
          <div class="optrow"><button id="openMp" style="flex:1;"></button></div>
          <button class="close" id="closeSet"></button>
        </div>
      </div>
