name: CI
permissions:
  contents: read        # the smoke test reads; nothing in CI may push
  issues: read          # R3: the Closes check reads the issues a PR says it closes
  pull-requests: read
on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0   # test/runs.js reads who set accepted/rejected; a depth-1 clone answers HEAD for every file (finding A4)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - name: Install Playwright + Chromium
        run: |
          npm install playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Branded templates match neutral + brand.yml
        run: node docs/templates/build-branded.js --check
      - name: Headless smoke test
        run: node test/smoke.js
      - name: El Changarrito smoke
        run: node test/town.smoke.js
      - name: Engine smoke, against both games (R4)
        run: |
          node test/engine.smoke.js --index index.html
          node test/engine.smoke.js --index changarrito/index.html
      - name: The gauge — a brand-new world still boots and meets the engine on the same terms
        run: node test/gauge.js
      # El Horno ships to the public site from 2026-09-22, so what it does has to be checked before a
      # merge and not after one. Until today this file ran nowhere and was, by docs/POSTMORTEM.md 13h,
      # a receipt and not a guard: it had been planted, and nothing re-ran it. It also builds its own
      # shell from index.html and asserts every edit matched, so a change to the public shell that
      # silently stops matching turns THIS step red rather than publishing a page nobody can open.
      - name: El Horno — one room, one tray, one verb, and its shell still builds from index.html
        run: node test/horno.js
      # The run ledger (docs/RUNS.md): every run has a unique ID naming its agent, says what was
      # asked and what proved it, and no agent has written the owner's two words. The authorship
      # half cannot run on a shallow checkout and SAYS SO rather than reporting a pass it skipped.
      - name: The run ledger, and the two words that are the owner's
        run: node test/runs.js
      # R10 ran only in pages.yml, i.e. only AFTER merge, in a workflow whose deploy steps carry
      # continue-on-error. So a pull request that widened the copy list was green and the failure
      # surfaced on the public internet. Build the same box here and check it before it can merge.
      - name: R10 — what we would publish is only the public game
        run: bash scripts/build-site.sh /tmp/_site && node test/public.js /tmp/_site
      # Finding GH-6 (2026-09-21): a `${{ }}` expression inside a run: line is expanded BEFORE the
      # shell parses it, and a git refname may carry `;` `$` and backticks. Every workflow value
      # goes under env: and is read as "$NAME" — the pattern PR_BODY already used. test/leaves.js
      # now fails the build on a `${{` inside any run: block.
      - name: The guards' own red cases, so a regex that regressed is caught before it is trusted
        run: node test/leaves.js --selftest && node test/runs.js --selftest && node test/issue.js --selftest
      - name: The issues this PR closes are the ones it talks about (R3)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff "origin/$BASE_REF"...HEAD > /tmp/pr.diff || git diff "origin/$BASE_REF" HEAD > /tmp/pr.diff
          node test/closes.js --diff-file /tmp/pr.diff
      - name: An engine change that never reaches a returning player is not shipped
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          node test/bump.js "origin/$BASE_REF"
      # ...AND ON A PUSH. Yaz, 2026-09-12: the step above carried `if: pull_request`, so a push ran
      # the whole suite and skipped this check entirely — and this repository's history is mostly
      # direct commits. Register entry #11 in docs/REGRESSION.md is about the same guard reading two
      # commits when it meant the working tree; this is its other half, and it is the half that
      # decides whether the hole was ever theoretical. The two halves have different right answers:
      # on the desk the question is "what is about to ship" (the tree); in CI the checkout is clean
      # and the question really is "what did these commits change", which is why the base is passed
      # explicitly here.
      - name: ...and the same, on a push, because most of this repo's history never saw a PR
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=50 origin "$REF_NAME" || true
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # a brand-new branch, or a shallow clone that cannot see the previous push
            if git cat-file -e "HEAD~1^{commit}" 2>/dev/null; then BASE="HEAD~1"; else echo "no base to compare against; nothing to check"; exit 0; fi
          fi
          node test/bump.js "$BASE" HEAD
