<title>Gimbap study</title>
<style>html,body{margin:0;background:#151210}canvas{display:block}</style>
<canvas id="c" width="1240" height="820"></canvas>
<script>
(function(){
var c=document.getElementById('c'),g=c.getContext('2d'),W=c.width,H=c.height;

function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgb(a){return '#'+a.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?'0':'')+v.toString(16);}).join('');}
function lit(h,t){var x=hex(h);return rgb([x[0]+255*t*.92,x[1]+255*t*.80,x[2]+255*t*.58]);}
function shade(h,t){var x=hex(h);return rgb([x[0]*(1-t*1.05),x[1]*(1-t*.98),x[2]*(1-t*.80)]);}

/* ── THE TARGET, and it is a structure before it is a picture ──────────────────────────────────
   A slice of gimbap is a CYLINDER SEEN END-ON, and its cross-section has four rings and a bundle:

     1. NORI   a THIN dark line, about 3% of the radius. Not a band. This is the single thing the
               current drawing gets most wrong: a fat ring of seaweed reads as the edge of a fried
               egg, and that is exactly what six of them looked like.
     2. RICE   the widest thing in the picture, roughly 30% of the radius, warm white, with grain —
               it should DOMINATE. In the current drawing the rice is a thin annulus.
     3. BUNDLE the middle, about 74% of the RADIUS — it CROWDS the round. It is not a ring of dots
               and it is not a badge in a field: a handful of long strips seen end-on, so bars and
               rectangles, in three or four nearly-parallel rows, pressed against each other with
               almost no rice showing between them.
               (This line said "about half the diameter" until 2026-09-16, when the owner sent
               photographs. It was the biggest of the six things reasoning from the word "gimbap"
               had got wrong.)
     4. OIL    a sheen off the rice on the key side only, and the cut face catching the light.

   The fillings are named things with named colours, and the two yellows are different yellows:
     danmuji (pickled radish)  #F2C93B   the bright one — this is what makes a slice read as gimbap
     egg                       #EBD489   paler, softer edge
     carrot                    #D9662B
     spinach                   #3E6B37   a clump, never a bar
     burdock or beef           #7A4A28
     crab stick                #F2EEE4   white, with one pink edge
────────────────────────────────────────────────────────────────────────────────────────────────*/

function round(cx,cy,d,turn,detail){
  var r=d/2, ry=r*0.94;                       /* barely an ellipse: you are almost over it */
  /* it sits on something */
  var sh=g.createRadialGradient(cx+r*.10,cy+ry*.92,0,cx+r*.10,cy+ry*.92,r*1.05);
  sh.addColorStop(0,'rgba(8,5,3,.55)'); sh.addColorStop(1,'rgba(8,5,3,0)');
  g.save(); g.translate(cx+r*.10,cy+ry*.92); g.scale(1,.30); g.translate(-(cx+r*.10),-(cy+ry*.92));
  g.fillStyle=sh; g.beginPath(); g.arc(cx+r*.10,cy+ry*.92,r*1.05,0,7); g.fill(); g.restore();

  /* 1 · NORI — thin, and darkest on the shadow side */
  var ng=g.createLinearGradient(cx-r,cy-ry,cx+r,cy+ry);
  ng.addColorStop(0,'#2E4029'); ng.addColorStop(.45,'#1B2617'); ng.addColorStop(1,'#0C1109');
  g.fillStyle=ng; g.beginPath(); g.ellipse(cx,cy,r,ry,0,0,7); g.fill();

  /* 2 · THE RICE, AND IT STAYS BRIGHT ALL THE WAY OUT. The previous version shaded the outer
     edge to #CFC3A6, which is a perfectly good piece of lighting and it made the nori disappear:
     at page size the dark ring only reads because the rice next to it is nearly white. What makes
     a thumbnail say "gimbap" is that contrast, not the shading. */
  var RR=r*0.935, RRy=ry*0.935;
  var rgd=g.createRadialGradient(cx-RR*.34,cy-RRy*.36,RR*.08,cx,cy,RR*1.02);
  rgd.addColorStop(0,'#FFFDF6'); rgd.addColorStop(.62,'#F6F0E2'); rgd.addColorStop(1,'#E6DDC8');
  g.fillStyle=rgd; g.beginPath(); g.ellipse(cx,cy,RR,RRy,0,0,7); g.fill();
  var sd=1013904223^Math.round(d*7+turn*100), rnd=function(){sd=(sd*1664525+1013904223)>>>0;return sd/4294967296;};
  g.save(); g.beginPath(); g.ellipse(cx,cy,RR,RRy,0,0,7); g.clip();
  for(var i=0;i<Math.round(d*1.5);i++){
    var a=rnd()*Math.PI*2, rr=RR*(0.52+rnd()*0.46);
    var x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr*(RRy/RR);
    g.save(); g.translate(x,y); g.rotate(a+Math.PI/2);
    g.globalAlpha=.10+rnd()*.16;
    g.fillStyle=rnd()<.5?'#FFFFFF':'#B9AB8C';
    g.fillRect(-r*.020,-r*.008,r*.040,r*.016);
    g.restore();
  }
  g.restore();

  /* 3 · THE BUNDLE — redrawn 2026-09-16 from photographs the owner supplied, and six things were
     wrong that no amount of reasoning from the word "gimbap" had fixed:
     · it was TOO SMALL. The filling is about 62% of the diameter, not 50: in a real slice the
       rice is a ring around a crowded middle, not a field with a badge on it.
     · there were FIVE things in it. There are seven or eight, and they are crowded.
     · they were SQUARE. They are long strips lying across the middle, most of them spanning
       half the width or more, stacked in rough horizontal bands.
     · the edges were CRISP. This is food that has been rolled and squeezed: every edge is
       soft and slightly bowed.
     · the colours were POLITE. Danmuji is a strong yellow, carrot is orange, spinach is a
       dark green — they are the brightest things in the picture and they should be.
     · there was RICE SHOWING between every pair. There is almost none: the strips touch. */
  var B=r*0.74, dark='rgba(26,18,10,.26)';
  g.save(); g.translate(cx,cy); g.rotate(turn*0.7);
  function strip(x,y,w,h,col,rot,edge){
    g.save(); g.translate(x,y); g.rotate(rot||0);
    /* SOFT CORNERS, NOT CAPSULES. At 0.42 of the height every strip came back reading as a
     medicine capsule; the photographs show rectangles that have been squeezed, which is a
     small radius on a long edge, not a rounded end. */
    var rr=Math.min(h*0.26,w*0.16);
    var bg=g.createLinearGradient(0,-h/2,0,h/2);
    bg.addColorStop(0,lit(col,.20)); bg.addColorStop(.42,col); bg.addColorStop(1,shade(col,.26));
    g.fillStyle=bg;
    g.beginPath();
    if(g.roundRect) g.roundRect(-w/2,-h/2,w,h,rr);
    else { g.moveTo(-w/2+rr,-h/2); g.lineTo(w/2-rr,-h/2);
       g.quadraticCurveTo(w/2,-h/2,w/2,-h/2+rr); g.lineTo(w/2,h/2-rr);
       g.quadraticCurveTo(w/2,h/2,w/2-rr,h/2); g.lineTo(-w/2+rr,h/2);
       g.quadraticCurveTo(-w/2,h/2,-w/2,h/2-rr); g.lineTo(-w/2,-h/2+rr);
       g.quadraticCurveTo(-w/2,-h/2,-w/2+rr,-h/2); }
    g.fill();
    g.fillStyle='rgba(255,255,255,.26)';
    g.fillRect(-w/2+rr*.6,-h/2,w-rr*1.2,Math.max(.8,h*.12));
    g.fillStyle=dark;
    g.fillRect(-w/2+rr*.6,h/2-Math.max(.8,h*.11),w-rr*1.2,Math.max(.8,h*.11));
    if(edge){ g.fillStyle=edge; g.fillRect(-w/2+rr*.5,-h/2,w-rr,Math.max(1,h*.20)); }
    g.restore();
  }
  /* three crowded bands, the way a rolled mat actually stacks them. Widths are fractions of B,
     so the whole bundle scales with the round and the arrangement turns with the turn. */
  /* THEY STACK IN BANDS, THEY DO NOT SCATTER. The first pass from the photographs spread them
     across the middle at seven different angles and it came back as confetti on a disc. In the
     photographs the strips lie nearly parallel, in three or four rough rows, and the rows are
     what you read at thumbnail size — so the rotations are tiny and the rows are tight. */
  /* FOUR TIGHT ROWS THAT FILL THE MIDDLE. Against the photographs the last pass left a wide
     white margin and gaps between every strip: in a real slice the filling CROWDS the round and
     the strips press against each other, so the rice is a band around a full middle and not a
     field with a few things on it. Rows at -0.47, -0.16, 0.16, 0.47 of B, strips 0.30 tall. */
  strip(-B*0.08,-B*0.47, B*1.20, B*0.30, '#F2C51F', -0.015);       /* danmuji — the big one */
  strip( B*0.62,-B*0.46, B*0.46, B*0.28, '#6E9E4A',  0.02);      /* cucumber */
  strip(-B*0.30,-B*0.16, B*0.94, B*0.30, '#E2661F', -0.01);      /* carrot */
  strip( B*0.52,-B*0.15, B*0.62, B*0.30, '#F0DC7A',  0.015);       /* egg */
  strip(-B*0.38, B*0.16, B*0.82, B*0.30, '#8A6236',  0.01);      /* burdock */
  strip( B*0.46, B*0.16, B*0.66, B*0.28, '#F5EFE4', -0.015,'#E86B84'); /* crab stick */
  strip(-B*0.04, B*0.47, B*1.04, B*0.28, '#7A4325',  0.01);      /* beef */
  /* spinach is the one thing in there with no edges — a squeezed clump, and it belongs INSIDE
     the bundle. The last pass put it out in the rice, where it read as peas on a plate. */
  g.fillStyle='#2F5B2A';
  [[-0.46,-0.47,.17,.14],[0.56,0.47,.17,.13],[-0.54,0.16,.15,.14],[0.34,-0.16,.16,.14]]
    .forEach(function(p,i){
    g.beginPath(); g.ellipse(B*p[0],B*p[1],B*p[2],B*p[3],i*0.3,0,7); g.fill();
    });
  g.fillStyle='rgba(255,255,255,.12)';
  g.beginPath(); g.ellipse(-B*0.50,-B*0.24,B*0.09,B*0.05,-0.3,0,7); g.fill();
  g.restore();

  /* 4 · the cut face catches the light, on the key side only */
  g.save(); g.beginPath(); g.ellipse(cx,cy,RR,RRy,0,0,7); g.clip();
  g.globalAlpha=.16; g.fillStyle='#fff';
  g.beginPath(); g.ellipse(cx-RR*.34,cy-RRy*.34,RR*.40,RRy*.26,-0.5,0,7); g.fill();
  g.restore();
  /* and the nori's own lit edge, upper left */
  g.strokeStyle='rgba(190,205,185,.34)'; g.lineWidth=Math.max(1,r*.022);
  g.beginPath(); g.ellipse(cx,cy,r*0.985,ry*0.985,0,Math.PI*1.04,Math.PI*1.86); g.stroke();

  if(detail) label(cx,cy,r);
}

/* EVERY LABEL GOES TO THE RIGHT OF THE ROUND AND NOWHERE ELSE. The first version fanned them at
   angles and three of the four ran off the edge of the sheet — the leader line is what says which
   part is meant, so the text does not need to sit next to it. */
function label(cx,cy,r){
  g.save();
  g.lineWidth=1.4; g.textAlign='left';
  var COL=cx+r+118;
  var rows=[
    ['NORI',   'a thin line, about 4% of the radius', -0.76, -0.62, -0.96],
    ['RICE',   'the widest thing in the picture',     -0.16, -0.90, -0.42],
    ['BUNDLE', 'bars, packed and touching',            0.06,  0.10,  0.16],
    ['DANMUJI','the bright yellow, and the tell',     -0.38, -0.30,  0.66]
  ];
  rows.forEach(function(rw){
    var x=cx+r*rw[2], y=cy+r*rw[3], ty=cy+r*rw[4];
    g.strokeStyle='rgba(142,131,117,.75)';
    g.beginPath(); g.moveTo(x,y); g.lineTo(COL-14,ty-5); g.stroke();
    g.fillStyle='#E0703F'; g.beginPath(); g.arc(x,y,4,0,7); g.fill();
    g.fillStyle='#EFE7D6'; g.font='700 16px ui-monospace,monospace';
    g.fillText(rw[0],COL,ty);
    g.fillStyle='#A4927D'; g.font='400 15px ui-monospace,monospace';
    g.fillText(rw[1],COL,ty+21);
  });
  g.restore();
}

/* ── the sheet ── */
var bg=g.createLinearGradient(0,0,W*0.4,H);
bg.addColorStop(0,'#201A16'); bg.addColorStop(1,'#12100E');
g.fillStyle=bg; g.fillRect(0,0,W,H);

g.fillStyle='#EFE7D6'; g.font='700 27px ui-serif,Georgia,serif';
g.fillText('What a slice of gimbap actually is',44,56);
g.fillStyle='#A4927D'; g.font='400 16px ui-monospace,monospace';
g.fillText('a cylinder seen end-on: a thin nori line, a wide ring of rice, and a packed bundle in the middle',44,84);

round(262,330,330,-0.22,true);

/* the row, at the size it appears on the page — six, cut by hand, no two the same */
g.fillStyle='#A4927D'; g.font='600 14px ui-monospace,monospace';
g.fillText('AT PAGE SIZE — six cut by hand, and no two the same',72,552);
/* AND THE LEFT EDGE OF THE TEXT IS THE RIGHT EDGE OF THIS ROW. The fix for the overflow moved the
   column to 790 and walked it straight over the sixth round — the same mistake in the other
   direction, which is what happens when you measure one edge and not the pair. The row ends at
   660 + its radius; the column starts at 790. */
var ds=[104,90,112,96,108,86], ys=[0,-7,3,-10,5,-3];
ds.forEach(function(d,i){
  round(120+i*108, 630+ys[i], d, i*0.9, false);
});

/* THE MEASURE IS THE CANVAS MINUS THE MARGIN, and it is not a guess: 14px monospace is ~8.4px a
   character, the column starts at 790 and the sheet ends at 1240, so 44 characters is the line and
   anything longer walks off the edge — which is what the first two versions of this did. */
/* THIS COLUMN NAMES THE RENDER IT JUDGED. It described the version before the photographs
   arrived; leaving it would be exactly the stale verdict table LICENCES.md warns about. */
var lines=[
  'WHAT THE PHOTOGRAPHS CORRECTED',
  'the nori was a BAND. It is a thin line, and',
  'the rice beside it has to stay near white or',
  'the line disappears at page size',
  'the middle was HALF the radius and spaced',
  'out. It is 74%, in tight rows, pressed',
  'together, with almost no rice between',
  'the strips were dots, then capsules. They',
  'are squeezed rectangles — small radius on a',
  'long edge, not a rounded end',
  'the colours were polite. Danmuji, carrot and',
  'spinach are the brightest things in there'
];
lines.forEach(function(t,i){
  g.fillStyle = i===0 ? '#E0703F' : (i%2===1 ? '#9C8F7E' : '#77695C');
  g.font = i===0 ? '700 15px ui-monospace,monospace' : '400 14px ui-monospace,monospace';
  g.fillText(t, 790, 540 + (i===0?0:18) + i*22);
});
})();
</script>
